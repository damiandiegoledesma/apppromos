<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppPromos · Seeder</title>
  <style>
    :root{
      --bg:#f6f3ee;
      --card:#ffffff;
      --text:#1f1f1f;
      --muted:#6e6e6e;
      --line:#e7e1d8;
      --brand:#b63b2b;
      --brand-dark:#8d2f23;
      --ok:#1d6f42;
      --warn:#8f6200;
      --radius:18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(180deg,#f8f5f0 0%, #f1ebe2 100%);
      color:var(--text);
    }
    .wrap{
      max-width:760px;
      margin:0 auto;
      padding:20px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:0 20px 50px rgba(0,0,0,.08);
      padding:24px;
    }
    h1{margin:0 0 10px}
    p{color:var(--muted); line-height:1.5}
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:18px;
    }
    button,a{
      min-height:48px;
      padding:0 16px;
      border:none;
      border-radius:14px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .primary{background:var(--brand); color:#fff;}
    .primary:hover{background:var(--brand-dark);}
    .secondary{
      background:#fff;
      color:var(--text);
      border:1px solid var(--line);
    }
    .log{
      margin-top:18px;
      padding:14px;
      border-radius:14px;
      background:#fbfaf8;
      border:1px solid var(--line);
      min-height:120px;
      white-space:pre-wrap;
      line-height:1.5;
      font-size:14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card">
      <h1>Seeder inicial</h1>
      <p>
        Carga la base mínima obligatoria en Firebase:
        <strong>catalogs/baseProducts</strong>,
        <strong>businesses/demo/core/meta</strong> y
        <strong>businesses/demo/core/state</strong>.
      </p>

      <div class="actions">
        <button id="btnSeedAll" class="primary" type="button">Cargar seed mínimo</button>
        <button id="btnReindexSlugs" class="secondary" type="button">Reindexar slugs Web Premium</button>
        <button id="btnReindexPhones" class="secondary" type="button">Reindexar teléfonos únicos</button>
        <a class="secondary" href="./index.html">Volver al inicio</a>
        <a class="secondary" href="./app.html">Ir a la app</a>
      </div>

      <pre id="seedLog" class="log">Esperando acción…</pre>
    </main>
  </div>

  <script type="module" src="./js/seeder-main.js"></script>
</body>
</html>
