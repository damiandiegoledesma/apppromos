      function applyStoreView(nextView="home",{focusSearch=false,restoreProductScroll=true,skipAutoScroll=false}={}){
        const view=validStoreViews.has(nextView)?nextView:"home";
        if(activeStoreView==="products")productScrollY=Math.max(0,Math.round(window.scrollY||0));
        activeStoreView=view;

        app.querySelectorAll("[data-store-view]").forEach((section)=>{
          section.classList.toggle("is-active",section.dataset.storeView===view);
        });

        const mobileNav=app.querySelector("[data-mobile-nav]");
        const nextMobileNav=renderMobileNavHtml();
        if(mobileNav)mobileNav.outerHTML=nextMobileNav;

        saveViewState();
        requestAnimationFrame(()=>{
          if(!skipAutoScroll){
            if(view==="products"&&restoreProductScroll&&productScrollY>0){
              window.scrollTo({top:productScrollY,behavior:"auto"});
            }else{
              const section=app.querySelector(`[data-store-view="${view}"]`);
              if(section)window.scrollTo({top:Math.max(0,section.getBoundingClientRect().top+window.scrollY-70),behavior:"smooth"});
              else window.scrollTo({top:0,behavior:"smooth"});
            }
          }
          if(view==="products"&&focusSearch){
            const search=app.querySelector("[data-product-search]");
            if(search instanceof HTMLInputElement)window.setTimeout(()=>search.focus({preventScroll:true}),350);
          }
          scheduleCheckoutFloatingState();
        });
      }

      function applyProductView(){
        const term=normalizeSlug(activeProductSearch);
        let visibleCount=0;
        app.querySelectorAll("[data-rubro-card]").forEach(card=>{
          const rubro=card.dataset.rubroCard||"";
          const rubroMatches=Boolean(activeProductRubro)&&(activeProductRubro==="Todos"||activeProductRubro===rubro);
          let cardCount=0;
          card.querySelectorAll("[data-product-name]").forEach(product=>{
            const matches=rubroMatches&&(!term||String(product.dataset.productName||"").includes(term));
            product.hidden=!matches;
            if(matches)cardCount+=1;
          });
          card.hidden=cardCount===0;
          visibleCount+=cardCount;
        });
        app.querySelectorAll("[data-product-rubro-quick]").forEach(button=>button.classList.toggle("is-active",button.dataset.productRubroQuick===activeProductRubro));
        const result=app.querySelector("[data-product-filter-result]");
        const message=app.querySelector("[data-product-filter-message]");
        const label=visibleCount===1?"producto":"productos";
        if(result)result.textContent=!activeProductRubro?"Elegí un rubro o buscá un producto.":`${visibleCount} ${label}${activeProductRubro!=="Todos"?` de ${publicRubroName(activeProductRubro)}`:""}`;
        if(message){
          message.hidden=Boolean(activeProductRubro)&&visibleCount>0;
          message.textContent=!activeProductRubro?`Elegí ${publicRubroName("Novillo")}, Cerdo, Pollo o ingresá a Más rubros.`:"No encontramos productos con esa búsqueda.";
        }
      }
      applyProductView();

        else window.scrollTo({top:0,behavior:"auto"});

      }));

      window.addEventListener("scroll",scheduleCheckoutFloatingState,{passive:true});
      window.addEventListener("resize",scheduleCheckoutFloatingState,{passive:true});

      const showcaseTrack=app.querySelector("[data-showcase-track]");
      function moveShowcase(direction=1){
        if(!showcaseTrack)return;
        const card=showcaseTrack.querySelector(".showcase-card");
        const step=(card?.getBoundingClientRect().width||240)+12;
        const atEnd=showcaseTrack.scrollLeft+showcaseTrack.clientWidth>=showcaseTrack.scrollWidth-8;
        if(direction>0&&atEnd)showcaseTrack.scrollTo({left:0,behavior:"smooth"});
        else showcaseTrack.scrollBy({left:direction*step,behavior:"smooth"});
      }
      if(showcaseTrack&&randomShowcase.length>1)window.setInterval(()=>moveShowcase(1),5000);

      app.onclick=(event)=>{
        const target=event.target instanceof Element?event.target:event.target?.parentElement;
        if(!target)return;
        const viewTarget=target.closest("[data-store-view-target]");
        if(viewTarget){
          event.preventDefault();
          const view=String(viewTarget.dataset.storeViewTarget||"home");
          applyStoreView(view,{focusSearch:view==="products"&&Boolean(viewTarget.dataset.navProducts),restoreProductScroll:true});
          return;
        }
        const directoChip=target.closest("[data-sf-chip]");
        if(directoChip){
          event.preventDefault();
          engineActiveRubro=directoChip.dataset.sfChip||"";
          app.querySelectorAll("[data-sf-chip]").forEach(btn=>btn.classList.toggle("is-active",btn===directoChip));
          const grid=app.querySelector("[data-sf-grid]");
          if(grid)grid.outerHTML=engineGridHtml();
          return;
        }
        const directoProductsChip=target.closest("[data-sf-products-chip]");
        if(directoProductsChip){
          event.preventDefault();
          engineProductsActiveRubro=directoProductsChip.dataset.sfProductsChip||"";
          app.querySelectorAll("[data-sf-products-chip]").forEach(btn=>btn.classList.toggle("is-active",btn===directoProductsChip));
          const body=app.querySelector("[data-sf-products-body]");
          if(body)body.innerHTML=engineProductsBodyHtml();
          return;
        }
        const directoOfferChip=target.closest("[data-sf-offer-chip]");
        if(directoOfferChip){
          event.preventDefault();
          engineOfferFilter=directoOfferChip.dataset.sfOfferChip||"Todas";
          app.querySelectorAll("[data-sf-offer-chip]").forEach(btn=>btn.classList.toggle("is-active",btn===directoOfferChip));
          const body=app.querySelector("[data-sf-promos-body]");
          if(body)body.innerHTML=enginePromosBodyHtml();
          return;
        }
        const showcaseItem=target.closest("[data-showcase-target]");
        if(showcaseItem){
          event.preventDefault();
          const kind=showcaseItem.dataset.showcaseKind||"product";
          const view=showcaseItem.dataset.showcaseView||"products";
          const anchor=showcaseItem.dataset.showcaseTarget||"";

          if(kind==="product"){
            const rubro=showcaseItem.dataset.showcaseRubro||"Todos";
            activeProductRubro=rubro;
            activeProductSearch="";
            const select=app.querySelector("[data-product-rubro-select]");
            if(select instanceof HTMLSelectElement)select.value=secondaryProductRubros.includes(rubro)?rubro:"";
            const search=app.querySelector("[data-product-search]");
            if(search instanceof HTMLInputElement)search.value="";
            applyProductView();
          }else if(kind==="promo"){
            activeOfferFilter="Todas";
            activeOfferRubroFilter="Todos";
            offersExpanded=true;
            app.querySelectorAll("[data-offer-filter]").forEach(btn=>btn.classList.toggle("is-active",btn.dataset.offerFilter==="Todas"));
            const offerRubroSelect=app.querySelector("[data-offer-rubro-select]");
            if(offerRubroSelect instanceof HTMLSelectElement)offerRubroSelect.value="Todos";
            const offerRubroIcon=app.querySelector("[data-offer-rubro-select-icon]");
            if(offerRubroIcon)offerRubroIcon.textContent="🥩";
            applyOfferView();
          }

          applyStoreView(view,{restoreProductScroll:false,skipAutoScroll:true});
          saveViewState();

          const destination=anchor?document.getElementById(anchor):null;
          if(destination){
            destination.classList.remove("product-from-showcase");
            destination.scrollIntoView({behavior:"smooth",block:"center"});
            window.setTimeout(()=>destination.classList.add("product-from-showcase"),350);
            window.setTimeout(()=>destination.classList.remove("product-from-showcase"),3000);
          }
          return;
        }
        const quickRubro=target.closest("[data-product-rubro-quick]");
        if(quickRubro){
          event.preventDefault();
          activeProductRubro=quickRubro.dataset.productRubroQuick||"";
          const select=app.querySelector("[data-product-rubro-select]");
          if(select instanceof HTMLSelectElement)select.value="";
          applyProductView();
          saveViewState();
          return;
        }
        if(target.closest("[data-showcase-prev]")){event.preventDefault();moveShowcase(-1);return}
        if(target.closest("[data-showcase-next]")){event.preventDefault();moveShowcase(1);return}
        const offerFilter=target.closest("[data-offer-filter]");
        if(offerFilter){
          event.preventDefault();
          activeOfferFilter=offerFilter.dataset.offerFilter||"Todas";
          offersExpanded=false;
          app.querySelectorAll("[data-offer-filter]").forEach(btn=>btn.classList.toggle("is-active",btn===offerFilter));
          applyOfferView();
          return;
        }

        const offersToggle=target.closest("[data-offers-toggle]");
        if(offersToggle){
          event.preventDefault();
          offersExpanded=!offersExpanded;
          applyOfferView();
          return;
        }

        const addButton=target.closest("[data-cart-add]");
        if(addButton){
          event.preventDefault();
          const item=decodeCartItem(addButton.dataset.cartAdd||"");
          if(item){
            addCartItem(item);
            announceCart(`${item.name||item.nombre||"Producto"} agregado al pedido`);
            const key=addButton.dataset.cartCell||cartItemKey(item);
            const isGridProduct=item.type==="product"&&!isOfferCartItem(item)&&addButton.hasAttribute("data-cart-cell");
            if(isGridProduct){
              // Un mismo producto puede tener una celda en más de una vista a la
              // vez (Home + Productos del layout "Directo al grano"); se
              // actualizan todas para que no queden desincronizadas.
              app.querySelectorAll(`[data-cart-cell="${key}"]`).forEach((cell)=>{
                const forceStepper=Boolean(cell.closest("[data-sf-grid],[data-sf-products-grid]"));
                cell.outerHTML=renderProductActionCell(item,cartQuantityForKey(key),{forceStepper});
              });
            }else{
              const original=addButton.textContent;
              addButton.textContent="Agregado ✓";
              addButton.classList.add("is-added");
              setTimeout(()=>{addButton.textContent=original;addButton.classList.remove("is-added")},1400);
            }
          }
          return;
        }
        const gridPlusButton=target.closest("[data-cart-grid-plus]");
        if(gridPlusButton){
          event.preventDefault();
          const cell=gridPlusButton.closest("[data-cart-cell]");
          const key=cell?.dataset.cartCell||"";
          if(key){changeCartItem(key,1);updateProductGridCell(key);}
          return;
        }
        const gridMinusButton=target.closest("[data-cart-grid-minus]");
        if(gridMinusButton){
          event.preventDefault();
          const cell=gridMinusButton.closest("[data-cart-cell]");
          const key=cell?.dataset.cartCell||"";
          if(key){changeCartItem(key,-1);updateProductGridCell(key);}
          return;
        }
        const plusButton=target.closest("[data-cart-plus]");
        if(plusButton){event.preventDefault();changeCartItem(plusButton.dataset.cartPlus||"",1);return}
        const minusButton=target.closest("[data-cart-minus]");
        if(minusButton){event.preventDefault();changeCartItem(minusButton.dataset.cartMinus||"",-1);return}
        const removeButton=target.closest("[data-cart-remove]");
        if(removeButton){event.preventDefault();removeCartItem(removeButton.dataset.cartRemove||"");return}
        const forgetButton=target.closest("[data-cart-forget]");
        if(forgetButton){
          event.preventDefault();
          const customer=currentCartCustomer();
          forgetRememberedCustomer();
          refreshCart({...customer,name:"",phone:"",remember:false});
          return;
        }
        const clearButton=target.closest("[data-cart-clear]");
        if(clearButton){event.preventDefault();if(cartItems.length&&confirm("¿Vaciar el pedido?")){cartItems=[];saveCartItems();refreshCart()}return}
        const sendButton=target.closest("[data-cart-send-order]");
        if(sendButton){event.preventDefault();sendCartOrder()}
      };

      app.onchange=(event)=>{
        const target=event.target;
        if(target instanceof HTMLSelectElement && target.matches("[data-offer-rubro-select]")){
          activeOfferRubroFilter=target.value||"Todos";
          const icon=app.querySelector("[data-offer-rubro-select-icon]");
          if(icon)icon.textContent=activeOfferRubroFilter==="Novillo"?"🐄":activeOfferRubroFilter==="Cerdo"?"🐖":activeOfferRubroFilter==="Pollo"?"🐔":activeOfferRubroFilter==="Mixtas"?"🔀":"🥩";
          offersExpanded=false;
          applyOfferView();
          return;
        }
        if(target instanceof HTMLSelectElement && target.matches("[data-product-rubro-select]")){
          activeProductRubro=target.value||"";
          applyProductView();
          saveViewState();
          return;
        }
        if(!(target instanceof HTMLInputElement))return;
        if(target.matches("[data-cart-remember]")){
          rememberCustomer=target.checked;
          if(rememberCustomer)saveRememberedCustomer(currentCartCustomer());
          else forgetRememberedCustomer();
          refreshCart();
          return;
        }
        if(target.name==="cartDelivery" || target.name==="cartPayment"){
          refreshCart();
        }
      };

      app.oninput=(event)=>{
        const target=event.target;
        if(!(target instanceof HTMLInputElement))return;
        if(target.matches("[data-sf-products-search]")){
          engineProductsSearch=target.value||"";
          const body=app.querySelector("[data-sf-products-body]");
          if(body)body.innerHTML=engineProductsBodyHtml();
          return;
        }
        if(target.matches("[data-product-search]")){
          activeProductSearch=target.value||"";
          if(activeProductSearch.trim()&&!activeProductRubro){
            activeProductRubro="Todos";
            const select=app.querySelector("[data-product-rubro-select]");
            if(select instanceof HTMLSelectElement)select.value="Todos";
          }
          applyProductView();
          saveViewState();
          return;
        }
        const field=target.id==="cartCustomerName"
          ? "name"
          : target.id==="cartCustomerPhone"
            ? "phone"
            : target.id==="cartCustomerAddress"
              ? "address"
              : "";
        if(!field)return;
        if(rememberCustomer&&(field==="name"||field==="phone"))saveRememberedCustomer(currentCartCustomer());
        const error=app.querySelector(`[data-cart-error="${field}"]`);
        if(error){
          error.textContent="";
          error.classList.remove("is-visible");
        }
        target.removeAttribute("aria-invalid");
      };
    }

    async function boot(){
      try{
        const source=await resolveWebSource();
        const payload=await loadPayload(source);
        await renderWeb(payload);
      }catch(e){
        console.error(e);
        const preview=isActivationPreview();
        app.innerHTML=`<div class="disabled"><h1>${preview?"Vista previa no disponible":"Error cargando web"}</h1><p>${esc(e.message||"No se pudo cargar")}</p>${preview?'<p><a href="/crear-carniceria.html?resume=1" style="display:inline-flex;min-height:42px;align-items:center;justify-content:center;padding:0 14px;border-radius:12px;background:#E52223;color:#fff;text-decoration:none;font-weight:900;">Volver a Carnis</a></p>':""}</div>`;
      }
    }
    boot();
  </script>
</body>
</html>
