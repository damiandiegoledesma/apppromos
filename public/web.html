<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Carnicería online | Carnis.app</title>
  <link id="businessFavicon" rel="icon" href="/assets/brand/carnis/app-icons/carnis-icon-48.png" />

  <!-- V12.26-G1 - Analytics de intencion de pedido publico -->
  <script src="/js/analytics-gate.js"></script>
  <style>
    :root{
      --red:#E52223;
      --red-2:#B3161A;
      --red-3:#8E1014;
      --dark:#17110f;
      --ink:#171717;
      --muted:#6b7280;
      --line:#eadfd8;
      --soft:#fff8f4;
      --paper:#fffdfb;
      --green:#22c55e;
      --green-dark:#0f6b32;
      --gold:#d4af37;
      --shadow:0 18px 50px rgba(47,22,14,.14);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box}
    html,body{width:100%;max-width:100%;overflow-x:hidden}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(229,34,35,.16), transparent 34%),
        linear-gradient(180deg,#fff8f2 0%,#f5ede6 58%,#f1e6dc 100%);
      color:var(--ink);
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit}
    .page{
      width:min(100%,1080px);
      margin:0 auto;
      padding:12px 10px calc(98px + var(--safe-bottom));
    }
    .hero{
      position:relative;
      overflow:hidden;
      color:#fff;
      border-radius:24px;
      padding:22px 16px 18px;
      background:
        linear-gradient(135deg,rgba(38,10,7,.96),rgba(179,22,26,.96)),
        radial-gradient(circle at 88% 15%,rgba(255,255,255,.2),transparent 28%);
      box-shadow:var(--shadow);
      isolation:isolate;
    }
    .hero:before{
      content:"";
      position:absolute;
      inset:auto -80px -120px auto;
      width:220px;
      height:220px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      z-index:-1;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 10px;
      border-radius:999px;
      background:rgba(255,255,255,.13);
      border:1px solid rgba(255,255,255,.18);
      color:rgba(255,255,255,.92);
      font-size:.78rem;
      font-weight:900;
      letter-spacing:.02em;
      text-transform:uppercase;
    }
    .hero h1{
      margin:13px 0 8px;
      font-size:clamp(2.05rem,13vw,4.5rem);
      letter-spacing:-.075em;
      line-height:.9;
      text-transform:uppercase;
      text-wrap:balance;
      max-width:12ch;
    }
    .hero p{
      margin:6px 0;
      color:rgba(255,255,255,.9);
      font-size:1rem;
      font-weight:780;
      line-height:1.35;
    }
    .hero-meta{
      display:grid;
      gap:8px;
      margin-top:14px;
    }
    .hero-meta p{
      margin:0;
      display:flex;
      align-items:center;
      gap:8px;
      min-height:34px;
      padding:8px 10px;
      border-radius:14px;
      background:rgba(255,255,255,.11);
      border:1px solid rgba(255,255,255,.12);
      font-size:.94rem;
    }
    .hero-actions{
      display:grid;
      gap:10px;
      margin-top:18px;
    }
    .btn{
      min-height:48px;
      border-radius:15px;
      padding:0 16px;
      font-weight:950;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      border:none;
      cursor:pointer;
      text-align:center;
      line-height:1.1;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
    }
    .btn-primary{
      background:linear-gradient(135deg,#29d66e,#16a34a);
      color:#062711;
      box-shadow:0 12px 26px rgba(34,197,94,.26);
    }
    .btn-light{background:#fff;color:var(--red-2)}
    .btn-ghost{background:#fff7ed;color:#7c2d12;border:1px solid #fed7aa}
    .section{margin-top:16px}
    .section-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:12px;
      margin:0 2px 10px;
    }
    .section h2{
      margin:0;
      color:var(--red-2);
      font-size:clamp(1.3rem,6vw,1.85rem);
      letter-spacing:-.035em;
      line-height:1;
    }
    .section small{color:var(--muted);font-weight:800}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    .card{
      background:rgba(255,255,255,.94);
      border:1px solid var(--line);
      border-radius:22px;
      padding:15px;
      box-shadow:0 8px 22px rgba(47,22,14,.055);
    }
    /* V12.13-C2-FIX2 - Web Arranque assets */
    .hero{
      background-image:
        linear-gradient(135deg,rgba(142,16,20,.94),rgba(179,22,26,.78),rgba(229,34,35,.72)),
        url('/assets/web-arranque/headers/header-mostrador-carniceria.webp');
      background-size:cover;
      background-position:center;
    }
    .offer-card{overflow:hidden;}
    .offer-cover{
      display:block;
      width:calc(100% + 30px);
      height:152px;
      margin:-15px -15px 13px;
      object-fit:cover;
      object-position:center;
      background:#f8eadf;
      border-radius:22px 22px 14px 14px;
    }
    .powered-card{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      width:fit-content;
      max-width:100%;
      margin:18px auto 0;
      padding:10px 13px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(255,255,255,.86);
      box-shadow:0 8px 22px rgba(47,22,14,.055);
    }
    .powered-card img{width:26px;height:26px;object-fit:contain;display:block;}
    .powered-card span{color:#B3161A;font-size:.86rem;font-weight:950;}
    .offer-title{
      font-weight:950;
      font-size:1.08rem;
      color:var(--red-2);
      line-height:1.15;
    }
    .items{margin:10px 0;color:#374151;line-height:1.55;font-weight:680}
    .price{font-size:1.75rem;font-weight:950;color:var(--red);margin:9px 0 12px;letter-spacing:-.04em}
    .price-list{display:grid;gap:12px}
    .rubro h3{margin:0 0 9px;color:#111827;font-size:1.05rem}
    .product{
      display:grid;
      grid-template-columns:64px minmax(0,1fr) auto;
      align-items:center;
      gap:12px;
      padding:10px 0;
      border-top:1px solid #f1ece7;
      min-width:0;
    }
    .product:first-of-type{border-top:none}
    .product-thumb-wrap{width:64px;height:64px;display:grid;place-items:center;border-radius:14px;background:#fff7ed;border:1px solid #ffedd5;overflow:hidden;}
    .product-thumb-wrap:empty{visibility:hidden;}
    .product-thumb{width:100%;height:100%;object-fit:contain;display:block;}
    .product span{min-width:0;overflow-wrap:anywhere;font-weight:720;color:#2b2724}
    .product strong{white-space:nowrap;color:var(--red-2);font-size:1.02rem}
    .empty,.starter-note{
      border-radius:22px;
      padding:17px;
      line-height:1.45;
      box-shadow:0 8px 22px rgba(47,22,14,.045);
    }
    .empty{border:1px dashed #d6c6bd;background:#fff;color:#6b7280;font-weight:800}
    .starter-note{
      border:1px solid #fed7aa;
      background:linear-gradient(180deg,#fffaf2,#fff7ed);
      color:#7c2d12;
      font-weight:820;
    }
    .starter-note strong{display:block;color:var(--red-2);font-size:1.12rem;margin-bottom:6px;letter-spacing:-.02em}
    .starter-actions{display:grid;gap:9px;margin-top:12px}
    .disabled{
      text-align:center;
      max-width:620px;
      margin:72px auto;
      background:#fff;
      border-radius:24px;
      padding:28px 18px;
      border:1px solid var(--line);
      box-shadow:var(--shadow);
    }
    .disabled h1{margin:0 0 8px;color:var(--red-2);letter-spacing:-.04em}
    .disabled p{margin:0;color:#4b5563;font-weight:720;line-height:1.45}
    .legal{color:#6b7280;font-size:.88rem;text-align:center;margin:18px 0 0;font-weight:720}
    .powered{margin:18px 0 0;text-align:center;color:#8a7a70;font-size:.84rem;font-weight:800}
    .sticky-wa{
      position:fixed;
      left:10px;
      right:10px;
      bottom:calc(10px + var(--safe-bottom));
      z-index:40;
      max-width:520px;
      margin:0 auto;
      pointer-events:none;
    }
    .sticky-wa a{width:100%;box-shadow:0 14px 30px rgba(34,197,94,.28);pointer-events:auto}

    /* V12.13-C3 - AppPromos visible + Carniza contextual */
    .page{padding-bottom:calc(138px + var(--safe-bottom));}
    .powered-card{
      max-width:520px;
      margin:28px auto 0;
      padding:14px 18px;
      border-radius:999px;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(179,22,26,.2);
      box-shadow:0 14px 34px rgba(47,22,14,.10);
    }
    /* V12.13-C4-FIX1 - sello AppPromos más visible */
    .powered-card img{width:58px;height:58px;}
    .powered-card span{
      color:#B3161A;
      font-size:1rem;
      line-height:1.16;
      font-weight:950;
    }

    /* V12.13-C5-FIX2 - pulido visual Web Arranque */
    .powered.powered-card{
      gap:14px;
      padding:16px 22px;
      min-height:76px;
      align-items:center;
    }
    .powered.powered-card img{
      width:78px;
      height:78px;
      object-fit:contain;
      flex:0 0 auto;
    }
    .powered.powered-card span{
      font-size:1.04rem;
      line-height:1.18;
      letter-spacing:-.01em;
    }
    .price-list{gap:18px;}
    .rubro{padding-top:18px;}
    .rubro h3{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin:0 0 13px;
      padding:7px 13px;
      border-radius:999px;
      background:rgba(229,34,35,.08);
      color:var(--red-2);
      border:1px solid rgba(229,34,35,.16);
      font-size:1.18rem;
      font-weight:950;
      line-height:1.08;
      letter-spacing:-.015em;
    }
    .rubro h3::before{
      content:"🥩";
      font-size:1rem;
      line-height:1;
    }
    .product span{font-size:.99rem;}
    @media (max-width:640px){
      .powered.powered-card{
        width:calc(100% - 28px);
        max-width:360px;
        padding:14px 16px;
        gap:12px;
      }
      .powered.powered-card img{width:68px;height:68px;}
      .powered.powered-card span{font-size:.98rem;}
      .rubro h3{font-size:1.12rem;padding:7px 12px;}
    }

    .carniza-web{
      position:fixed;
      right:14px;
      bottom:calc(14px + var(--safe-bottom));
      z-index:45;
      width:min(360px,calc(100vw - 28px));
      display:grid;
      grid-template-columns:52px 1fr;
      align-items:center;
      gap:11px;
      padding:10px;
      border-radius:24px;
      background:rgba(255,255,255,.97);
      border:1px solid rgba(179,22,26,.18);
      box-shadow:0 18px 42px rgba(47,22,14,.18);
    }
    .carniza-web > img{
      width:52px;
      height:52px;
      border-radius:999px;
      object-fit:cover;
      border:2px solid rgba(255,255,255,.95);
      box-shadow:0 9px 20px rgba(127,29,29,.18);
      background:#fff8f4;
    }
    .carniza-web strong{
      display:block;
      color:#B3161A;
      font-size:1rem;
      font-weight:950;
      line-height:1.12;
      margin-bottom:2px;
    }
    .carniza-web small{
      display:block;
      color:#5b3a32;
      font-size:.78rem;
      font-weight:800;
      line-height:1.22;
      margin-bottom:8px;
    }
    .carniza-web a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:36px;
      padding:0 13px;
      border-radius:999px;
      text-decoration:none;
      color:#062711;
      font-weight:950;
      background:linear-gradient(135deg,#29d66e,#16a34a);
      box-shadow:0 10px 22px rgba(34,197,94,.22);
      font-size:.84rem;
    }
    @media(max-width:520px){
      .page{padding-bottom:calc(140px + var(--safe-bottom));}
      .carniza-web{
        left:10px;
        right:10px;
        bottom:calc(10px + var(--safe-bottom));
        width:auto;
      }
    }
    @media(min-width:720px){
      .page{padding:24px 18px 96px}
      .hero{border-radius:30px;padding:36px 34px 30px}
      .hero h1{font-size:clamp(3rem,7vw,5.4rem)}
      .hero p{font-size:1.12rem}
      .hero-meta{grid-template-columns:repeat(2,minmax(0,1fr));max-width:720px}
      .hero-actions{display:flex;flex-wrap:wrap}.btn{width:auto;min-width:170px}.grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.sticky-wa{left:18px;right:18px;max-width:1060px}.sticky-wa a{max-width:420px;margin-left:auto}
    }
    @media(max-width:380px){
      .hero{padding:20px 14px;border-radius:20px}.hero h1{font-size:2rem}.card,.starter-note,.empty{border-radius:18px;padding:14px}.btn{min-height:46px;padding:0 12px}.product{grid-template-columns:1fr;gap:4px}.product strong{white-space:normal}
    }

    /* APPPROMOS V12.13-C6-FIX3-WEB-LIMPIA - cards sin fotos + sello clickeable */
    .offer-card{
      padding-top:18px;
    }
    .powered.powered-card{
      text-decoration:none;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .powered.powered-card:hover span{
      text-decoration:underline;
      text-underline-offset:3px;
    }

    /* APPPROMOS V12.17-A2-REBUILD - carrito limpio vidriera */
    .product{grid-template-columns:64px minmax(0,1fr) auto auto;gap:9px;padding:8px 0;min-height:68px;}
    .cart-add-mini{min-height:34px;padding:0 10px;border-radius:12px;border:1px solid #fed7aa;background:#fff7ed;color:#7c2d12;font-weight:950;cursor:pointer;white-space:nowrap;}
    .cart-add-btn{width:100%;margin-top:10px;}
    .cart-add-mini.is-added,.cart-add-btn.is-added{background:#dcfce7;border-color:#86efac;color:#166534;}
    /* V-Frente2 — stepper de 0,5 en la fila de producto (desktop/tablet). En
       mobile la fila se queda con el botón "Agregar" original: no hay lugar
       para el stepper de 3 partes dentro del círculo de 34px. */
    .cart-add-mini.cart-add-mini--stepper{display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px;min-width:118px;}
    .cart-grid-step{all:unset;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex:0 0 auto;border-radius:999px;background:#fff;border:1px solid #86efac;color:#166534;font-weight:1000;font-size:.95rem;line-height:1;cursor:pointer;}
    .cart-grid-step:hover{background:#f0fdf4;}
    .cart-grid-qty{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;line-height:1.05;font-weight:950;font-size:.82rem;color:#166534;white-space:nowrap;}
    .cart-grid-qty small{font-size:.6rem;font-weight:800;text-transform:lowercase;opacity:.85;}
    @media(max-width:640px){
      .cart-add-mini.cart-add-mini--stepper{display:none;}
    }
    .cart-section{margin-top:16px;}.cart-card{display:grid;gap:12px;background:linear-gradient(180deg,#fff,#fff7ed);border:1px solid #fed7aa;border-radius:24px;padding:16px;box-shadow:0 14px 34px rgba(47,22,14,.10)}
    .cart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.cart-head h2{margin:0;color:#7c2d12;font-size:1.35rem;letter-spacing:-.03em}.cart-head p{margin:4px 0 0;color:#7c2d12;font-weight:820;line-height:1.35}
    .cart-badge{display:inline-flex;align-items:center;min-height:30px;padding:0 11px;border-radius:999px;background:#ffedd5;border:1px solid #fed7aa;color:#7c2d12;font-weight:950;white-space:nowrap}
    .cart-items{display:grid;gap:8px}.cart-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid #f1e4d6;border-radius:18px;padding:10px;background:#fff}.cart-line strong{display:block;color:#2b2724;line-height:1.18;overflow-wrap:anywhere}.cart-line small{display:block;margin-top:3px;color:#7c2d12;font-weight:850;line-height:1.25}
    .cart-line-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}.cart-line-actions button{min-width:34px;min-height:34px;padding:0 10px;border-radius:12px;border:1px solid #fed7aa;background:#fff7ed;color:#7c2d12;font-weight:1000;cursor:pointer}.cart-line-actions .cart-remove{color:#ef233c;background:#fff1f0;border-color:#fecaca}
    .cart-line-quantity{min-width:64px;text-align:center;color:#7c2d12;font-size:.8rem;font-weight:950;white-space:nowrap;}
    .cart-total{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;border-radius:18px;background:#7c2d12;color:#fff;font-weight:950}.cart-total strong{font-size:1.25rem}
    .cart-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cart-form label{display:grid;gap:5px;color:#7c2d12;font-size:.78rem;font-weight:950;text-transform:uppercase;letter-spacing:.03em}.cart-form input{width:100%;min-height:44px;border:1px solid #fed7aa;border-radius:14px;padding:0 12px;font:inherit;font-weight:760;color:#2b2724;background:#fff}.cart-form--single{grid-template-columns:1fr}
    .cart-memory{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid #fed7aa;border-radius:15px;background:#fffaf7}.cart-memory label{display:flex;align-items:center;gap:8px;color:#7c2d12;font-size:.82rem;font-weight:900;line-height:1.25}.cart-memory input{width:18px;height:18px;margin:0;accent-color:#9a3412}.cart-forget{min-height:34px;padding:0 11px;border:1px solid #fecaca;border-radius:11px;background:#fff1f0;color:#ef233c;font-weight:900;cursor:pointer}.cart-empty-action{display:inline-flex;align-items:center;justify-content:center;min-height:38px;margin-top:10px;padding:0 13px;border:1px solid #fed7aa;border-radius:12px;background:#fff7ed;color:#7c2d12;text-decoration:none;font-weight:950}.cart-live-status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .cart-floating,.carniza-web{transition:opacity .18s ease,transform .18s ease,visibility .18s ease}.cart-floating.is-checkout-hidden,.carniza-web.is-checkout-hidden{opacity:0;visibility:hidden;pointer-events:none;transform:translateY(12px)}
    .cart-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:2px}.cart-choice{border:1px solid #fde68a;background:#fffdf5;border-radius:16px;padding:12px;display:flex;gap:8px;align-items:flex-start;font-weight:900;color:#7c2d12;line-height:1.18}.cart-choice input{margin-top:2px;accent-color:#9a3412}.cart-choice small{display:block;margin-top:4px;color:#92400e;font-weight:750;line-height:1.25;text-transform:none;letter-spacing:0}
    .cart-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.cart-actions .btn{min-width:180px}
    .cart-floating{position:fixed;left:14px;right:14px;bottom:calc(14px + var(--safe-bottom));z-index:80;max-width:520px;margin:0 auto;pointer-events:none}.cart-floating a{width:100%;pointer-events:auto;text-decoration:none;border:1px solid #f97316;background:#9a3412;color:#fff;border-radius:18px;box-shadow:0 18px 45px rgba(124,45,18,.28);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:950}.cart-floating strong{font-size:.98rem}.cart-floating span{font-size:.86rem;opacity:.95;text-align:right}
    @media(max-width:520px){.cart-form{grid-template-columns:1fr}.cart-choice-grid{grid-template-columns:1fr}.cart-actions .btn{width:100%;min-width:0}.product{grid-template-columns:54px minmax(0,1fr) auto}.cart-add-mini{grid-column:1 / -1;width:100%}.cart-line{grid-template-columns:1fr}.cart-line-actions{justify-content:flex-start}}

    /* APPPROMOS V12.18-C1 - vidriera mobile: navegación + productos compactos */
    .mobile-store-top,.mobile-store-nav{display:none;}
    @media(max-width:640px){
      .page{padding:8px 8px calc(92px + var(--safe-bottom));}
      .mobile-store-top{
        position:sticky;top:0;z-index:75;display:flex;align-items:center;justify-content:space-between;gap:10px;
        margin:-8px -8px 10px;padding:9px 10px;background:rgba(255,253,251,.97);
        border-bottom:1px solid var(--line);box-shadow:0 8px 22px rgba(47,22,14,.08);backdrop-filter:blur(12px);
      }
      .mobile-store-top-copy{min-width:0;display:grid;gap:1px;}
      .mobile-store-top strong{color:var(--red-2);font-size:.9rem;font-weight:1000;line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    html[data-storefront-theme="offer"] .rubro h3{background:#ffe600;border-color:#e5ce00;color:#171717}
    html[data-storefront-theme="offer"] .product-thumb-wrap{background:#fff9d6;border-color:#ebdf9f}

    /* V12.29 — fichas comerciales legibles y fallback de imagen visible. */
    .product{margin-top:8px;padding:10px;border:1px solid #efe1d8;border-radius:16px;background:#fff}
    .product-main{display:grid;gap:3px;min-width:0}
    .product-name{font-weight:900!important;color:#2b2724}
    .product-meta{font-size:.72rem!important;line-height:1.2!important;color:#7c655c!important;font-weight:800!important}
    .product-price{display:grid;gap:1px;text-align:right;white-space:nowrap;color:#7c2d12}
    .product-price small{font-size:.67rem;color:#7c655c;font-weight:850;text-transform:uppercase}
    .product-thumb-fallback{width:100%;height:100%;display:grid;place-items:center;font-size:1.55rem;background:#fff7ed}
    @media(max-width:640px){
      .product{grid-template-columns:54px minmax(0,1fr) auto 38px;min-height:66px;padding:7px}
      .product-price strong{font-size:.92rem}
      .product-meta{font-size:.66rem!important}
    }
    @media(max-width:370px){
      .product{grid-template-columns:48px minmax(0,1fr) 36px}
      .product-thumb-wrap{width:48px;height:48px}
      .product-price{grid-column:2;text-align:left}
      .cart-add-mini{grid-column:3;grid-row:1 / span 2}
    }
    /* V12.27.1 FIX2 - Business front photo keeps original colors. */
    .hero.hero--business-photo,
    html[data-storefront-theme="minimal_light"] .hero.hero--business-photo,
    html[data-storefront-theme="minimal_dark"] .hero.hero--business-photo,
    html[data-storefront-theme="butcher_red"] .hero.hero--business-photo,
    html[data-storefront-theme="offer"] .hero.hero--business-photo{background-image:var(--business-front)}

    /* ============================================================
       Frente 2 - MOTOR de layouts públicos ("engine")
       Un solo set de reglas (marcadas por [data-sf-engine]) + un
       bloque chico de variables por tema. Agregar un layout nuevo
       = agregar un bloque de variables, no repetir CSS.
       ============================================================ */
    html[data-storefront-theme="directo_al_grano"]{
      --sf-accent:#E52223; --sf-accent-dark:#B3161A; --sf-navy:#0A2E5B;
      --sf-bg:#FFFCFB; --sf-card-bg:#fff; --sf-border:#F5EFEC;
      --sf-thumb-bg:#FFF1F0; --sf-ink:#0f172a; --sf-muted:#64748b;
      --sf-muted-2:#94a3b8; --sf-added:#0f6b32; --sf-wa:#22c55e;
      --sf-font-body:'Poppins',Arial,sans-serif; --sf-font-display:'Kanit',Arial,sans-serif;
      --sf-nav-cols:5; --sf-choice-accent:var(--sf-accent); --sf-choice-bg:var(--sf-thumb-bg);
    }
    /* Los 4 layouts del mockup aprobado comparten exactamente la misma
       paleta (rojo/navy/crema) - lo que cambia entre ellos es la
       estructura (grilla, lista, tiles, tarjetas de combo), no el color.
       Sólo el acento de "elegido" en las tarjetas de entrega/pago
       cambia mockup a mockup. */
    html[data-storefront-theme="oferta_primero"]{
      --sf-accent:#E52223; --sf-accent-dark:#B3161A; --sf-navy:#0A2E5B;
      --sf-bg:#FFFCFB; --sf-card-bg:#fff; --sf-border:#F5EFEC;
      --sf-thumb-bg:#FFF1F0; --sf-ink:#0f172a; --sf-muted:#64748b;
      --sf-muted-2:#94a3b8; --sf-added:#0f6b32; --sf-wa:#22c55e;
      --sf-font-body:'Poppins',Arial,sans-serif; --sf-font-display:'Kanit',Arial,sans-serif;
      --sf-nav-cols:5; --sf-choice-accent:var(--sf-navy); --sf-choice-bg:#eef3f9;
    }
    html[data-storefront-theme="catalogo_vidriera"]{
      --sf-accent:#E52223; --sf-accent-dark:#B3161A; --sf-navy:#0A2E5B;
      --sf-bg:#FFFCFB; --sf-card-bg:#fff; --sf-border:#F5EFEC;
      --sf-thumb-bg:#FFF1F0; --sf-ink:#0f172a; --sf-muted:#64748b;
      --sf-muted-2:#94a3b8; --sf-added:#0f6b32; --sf-wa:#22c55e;
      --sf-font-body:'Poppins',Arial,sans-serif; --sf-font-display:'Kanit',Arial,sans-serif;
      --sf-nav-cols:5; --sf-choice-accent:var(--sf-accent); --sf-choice-bg:var(--sf-thumb-bg);
    }
    html[data-storefront-theme="combos_pedido_directo"]{
      --sf-accent:#E52223; --sf-accent-dark:#B3161A; --sf-navy:#0A2E5B;
      --sf-bg:#FFFCFB; --sf-card-bg:#fff; --sf-border:#F5EFEC;
      --sf-thumb-bg:#FFF1F0; --sf-ink:#0f172a; --sf-muted:#64748b;
      --sf-muted-2:#94a3b8; --sf-added:#0f6b32; --sf-wa:#22c55e;
      --sf-font-body:'Poppins',Arial,sans-serif; --sf-font-display:'Kanit',Arial,sans-serif;
      --sf-nav-cols:5; --sf-choice-accent:var(--sf-wa); --sf-choice-bg:#eefdf3;
    }

    html[data-sf-engine] body{font-family:var(--sf-font-body);background:var(--sf-bg);}
    html[data-sf-engine] .mobile-store-top{display:none!important;}
    .sf-header{position:sticky;top:0;z-index:15;background:var(--sf-card-bg);border-bottom:1px solid var(--sf-border);padding:14px 18px 12px;text-align:center;}
    .sf-header-wa{position:absolute;top:12px;right:18px;width:36px;height:36px;border-radius:50%;background:var(--sf-wa);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;}
    .sf-header-wa svg{width:17px;height:17px;fill:#fff;}
    .sf-logo{width:140px;max-width:44vw;height:auto;margin:0 auto;display:block;}
    .sf-logo-fallback{display:flex;flex-direction:column;align-items:center;gap:8px;}
    .sf-logo-mono{width:58px;height:58px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--sf-navy),#123f7d);color:#fff;font-family:var(--sf-font-display);font-weight:700;font-size:1.4rem;}
    .sf-logo-fallback-name{font-family:var(--sf-font-display);font-weight:700;font-size:1.05rem;color:var(--sf-navy);line-height:1.25;}
    .sf-meta{display:flex;flex-wrap:wrap;justify-content:center;column-gap:8px;row-gap:2px;margin-top:6px;font-size:.68rem;color:var(--sf-muted);line-height:1.4;}
    .sf-meta span+span:before{content:"·";margin-right:8px;color:#cbd5e1;}
    .sf-chips{display:flex;gap:8px;padding:14px 18px 4px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .sf-chip{flex:0 0 auto;padding:8px 16px;border-radius:999px;font-size:.8rem;font-weight:600;border:1px solid var(--sf-border);color:var(--sf-navy);background:var(--sf-card-bg);white-space:nowrap;cursor:pointer;}
    .sf-chip.is-active{background:var(--sf-accent);color:#fff;border-color:var(--sf-accent);}
    .sf-banner{margin:14px 18px 16px;padding:14px 16px;border-radius:14px;background:var(--sf-navy);display:flex;align-items:center;justify-content:space-between;text-decoration:none;gap:10px;}
    .sf-banner-eyebrow{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:#FFB4B4;font-weight:700;}
    .sf-banner-title{font-family:var(--sf-font-display);font-weight:600;font-size:.92rem;color:#fff;}
    .sf-banner-cta{font-size:.76rem;font-weight:700;color:#fff;background:var(--sf-accent);padding:8px 14px;border-radius:8px;white-space:nowrap;flex:0 0 auto;}
    .sf-grid{padding:0 18px 24px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .sf-card{background:var(--sf-card-bg);border:1px solid var(--sf-border);border-radius:14px;overflow:hidden;}
    .sf-card-thumb{aspect-ratio:4/3;height:auto;background:var(--sf-thumb-bg);display:flex;align-items:center;justify-content:center;font-size:1.6rem;overflow:hidden;}
    .sf-card-thumb img{width:100%;height:100%;object-fit:contain;}
    .sf-card-body{padding:10px 12px 12px;}
    .sf-card-name{font-size:.8rem;font-weight:600;line-height:1.3;}
    .sf-card-meta{font-size:.68rem;color:var(--sf-muted);margin:2px 0 6px;}
    .sf-card-price{font-family:var(--sf-font-display);font-weight:700;color:var(--sf-accent);font-size:.86rem;margin-bottom:6px;}
    html[data-sf-engine] .cart-add-mini{width:100%;background:var(--sf-accent);color:#fff;border-radius:8px;font-weight:700;}
    html[data-sf-engine] .cart-add-mini.is-added{background:var(--sf-added);}
    html[data-sf-engine] .cart-add-mini.cart-add-mini--stepper.is-added::before{content:none;}
    html[data-sf-engine] .cart-add-mini.cart-add-mini--stepper{background:var(--sf-border);color:var(--sf-ink);}
    html[data-sf-engine] .cart-grid-step{background:var(--sf-card-bg);color:var(--sf-accent);border:none;}
    html[data-sf-engine] .cart-grid-step.cart-grid-step--plus{background:var(--sf-accent);color:#fff;}
    html[data-sf-engine] .cart-grid-qty{color:var(--sf-ink);}
    html[data-sf-engine] .sf-card .cart-add-mini.cart-add-mini--stepper{display:flex!important;}
    html[data-sf-engine] .mobile-store-nav{grid-template-columns:repeat(var(--sf-nav-cols),minmax(0,1fr));}
    html[data-sf-engine] .mobile-store-nav a{color:var(--sf-muted);}
    html[data-sf-engine] .mobile-store-nav a.is-active{background:transparent;color:var(--sf-accent);}
    html[data-sf-engine] .mobile-store-nav a:active,html[data-sf-engine] .mobile-store-nav a:hover,html[data-sf-engine] .mobile-store-nav a:focus-visible{background:transparent;}
    html[data-sf-engine] .sf-nav-cart{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
    html[data-sf-engine] .sf-nav-cart .mobile-cart-badge{position:absolute;top:-2px;right:22%;}
    .sf-nav-icon{display:block;}
    html[data-sf-engine] .cart-floating.sf-cart-floating a{background:var(--sf-navy);border:none;border-radius:16px;box-shadow:0 10px 24px rgba(10,46,91,.28);padding:13px 16px;}
    .sf-cart-floating-copy{display:flex;flex-direction:column;gap:2px;}
    .sf-cart-floating-copy strong{font-family:var(--sf-font-display);font-size:.88rem;font-weight:600;}
    .sf-cart-floating-copy small{color:#b9c7dc;font-size:.78rem;}
    .sf-cart-floating-cta{display:flex;align-items:center;gap:4px;font-weight:700;font-size:.8rem;}
    /* Motor - Productos */
    .sf-products-head{position:sticky;top:0;z-index:15;background:var(--sf-card-bg);border-bottom:1px solid var(--sf-border);padding:14px 18px;}
    .sf-products-title{font-weight:700;font-size:.94rem;color:var(--sf-navy);margin-bottom:10px;}
    .sf-products-subtitle{font-size:.66rem;font-weight:700;color:var(--sf-muted-2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
    .sf-search{width:100%;padding:10px 13px;border-radius:11px;border:1px solid var(--sf-border);font-size:.82rem;background:var(--sf-bg);margin-bottom:10px;box-sizing:border-box;}
    .sf-products-body{padding:0 18px 110px;}
    .sf-sect{padding:14px 0 8px;font-weight:600;font-size:.8rem;color:var(--sf-navy);text-transform:uppercase;letter-spacing:.03em;}
    .sf-chip.sf-chip--sm{padding:7px 14px;font-size:.78rem;}
    /* Motor - Promos */
    .sf-combos{padding:14px 18px 110px;}
    .sf-combo{background:var(--sf-card-bg);border:1px solid var(--sf-border);border-radius:14px;overflow:hidden;margin-bottom:12px;}
    .sf-combo-thumb{height:90px;background:var(--sf-thumb-bg);}
    .sf-combo-body{padding:12px 14px;}
    .sf-combo-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;}
    .sf-combo-name{font-weight:700;font-size:.86rem;}
    .sf-combo-tag{background:var(--sf-border);color:var(--sf-navy);font-size:.62rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}
    .sf-combo-items{font-size:.72rem;color:var(--sf-muted);margin-bottom:8px;}
    .sf-combo-foot{display:flex;align-items:center;justify-content:space-between;}
    .sf-combo-price{font-weight:700;color:var(--sf-accent);font-size:1rem;}
    .sf-combo-add{background:var(--sf-accent);color:#fff;font-weight:700;font-size:.72rem;padding:8px 13px;border-radius:8px;border:none;cursor:pointer;}
    /* QA-C01.1 CP2 — Directo al grano: cinta de hoy con miniatura y
       tarjetas de Promos con "qué me llevo". Solo afecta a este estilo. */
    html[data-storefront-theme="directo_al_grano"] .sf-banner--strip{padding:9px 10px 9px 10px;gap:8px;}
    html[data-storefront-theme="directo_al_grano"] .sf-banner--strip .sf-banner-eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    html[data-storefront-theme="directo_al_grano"] .sf-banner-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
    html[data-storefront-theme="directo_al_grano"] .sf-banner-price{font-family:var(--sf-font-display);font-weight:700;font-size:.9rem;color:#fff;white-space:nowrap;}
    html[data-storefront-theme="directo_al_grano"] .sf-banner-main{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto;text-decoration:none;color:inherit;}
    html[data-storefront-theme="directo_al_grano"] .sf-banner-thumb{flex:0 0 48px;width:48px;height:48px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    html[data-storefront-theme="directo_al_grano"] .sf-banner-thumb img{width:44px;height:44px;object-fit:contain;display:block;}
    html[data-storefront-theme="directo_al_grano"] .sf-banner-copy{min-width:0;}
    html[data-storefront-theme="directo_al_grano"] .sf-banner--strip .sf-banner-title{font-size:.88rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    html[data-storefront-theme="directo_al_grano"] .sf-banner-add{flex:0 0 auto;font-size:.74rem;font-weight:700;color:#fff;background:var(--sf-accent);padding:7px 11px;border-radius:8px;border:none;cursor:pointer;white-space:nowrap;}
    html[data-storefront-theme="directo_al_grano"] .sf-banner-add.is-added{background:#16a34a;}
    html[data-storefront-theme="directo_al_grano"] .sf-combo-thumb{display:flex;align-items:center;justify-content:center;}
    html[data-storefront-theme="directo_al_grano"] .sf-combo-thumb img{height:86px;width:auto;max-width:60%;object-fit:contain;display:block;}
    html[data-storefront-theme="directo_al_grano"] .sf-combo-mosaic{position:relative;display:flex;align-items:center;justify-content:center;height:100%;padding:0 10px;}
    html[data-storefront-theme="directo_al_grano"] .sf-combo-mosaic img{height:86px;width:112px;max-width:none;object-fit:contain;position:relative;}
    html[data-storefront-theme="directo_al_grano"] .sf-combo-mosaic img+img{margin-left:-30px;}
    html[data-storefront-theme="directo_al_grano"] .sf-combo-more{position:relative;z-index:5;align-self:flex-end;margin:0 0 10px -8px;background:var(--sf-navy);color:#fff;font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;}
    html[data-storefront-theme="directo_al_grano"] .sf-combo-label{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sf-muted);margin-bottom:2px;}
    html[data-storefront-theme="directo_al_grano"] .sf-combo-was{margin-left:8px;font-size:.74rem;font-weight:600;color:var(--sf-muted);text-decoration:line-through;}
    html[data-storefront-theme="directo_al_grano"] .sf-combo-off{margin-left:6px;font-size:.68rem;font-weight:700;color:#fff;background:var(--sf-navy);padding:2px 6px;border-radius:999px;vertical-align:2px;}
    /* Motor - Oferta primero: hero grande, scroll de combos, tiles de rubro, filas */
    .sf-hero-promo{margin:14px 18px 6px;border-radius:16px;background:var(--sf-navy);overflow:hidden;}
    .sf-hero-promo-img{height:150px;background:rgba(255,255,255,.08);}
    .sf-hero-promo-body{padding:14px 16px 16px;}
    .sf-hero-promo-eyebrow{font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:#FFB4B4;font-weight:700;margin-bottom:4px;}
    .sf-hero-promo-title{font-family:var(--sf-font-display);font-weight:700;font-size:1.05rem;color:#fff;margin-bottom:2px;}
    .sf-hero-promo-desc{font-size:.76rem;color:#c7d3e6;margin-bottom:6px;}
    .sf-hero-promo-price{font-family:var(--sf-font-display);font-weight:700;font-size:1.15rem;color:#fff;margin-bottom:10px;}
    .sf-hero-promo-cta{display:inline-flex;align-items:center;gap:6px;background:var(--sf-wa);color:#fff;font-weight:700;font-size:.82rem;padding:10px 16px;border-radius:10px;text-decoration:none;}
    .sf-section-title{padding:16px 18px 6px;font-weight:700;font-size:.86rem;color:var(--sf-navy);font-family:var(--sf-font-display);}
    .sf-hscroll{display:flex;gap:10px;padding:2px 18px 6px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .sf-hscroll-card{flex:0 0 auto;width:150px;background:var(--sf-card-bg);border:1px solid var(--sf-border);border-radius:12px;overflow:hidden;}
    .sf-hscroll-thumb{height:90px;background:var(--sf-thumb-bg);}
    .sf-hscroll-body{padding:8px 10px 10px;}
    .sf-hscroll-name{font-size:.74rem;font-weight:600;line-height:1.25;}
    .sf-hscroll-meta{font-size:.64rem;color:var(--sf-muted);margin:2px 0 4px;}
    .sf-hscroll-price{font-family:var(--sf-font-display);font-weight:700;color:var(--sf-accent);font-size:.8rem;}
    .sf-rubro-tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:2px 18px 6px;}
    .sf-rubro-tile{background:var(--sf-card-bg);border:1px solid var(--sf-border);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;font-family:inherit;}
    .sf-rubro-tile-name{font-size:.72rem;font-weight:700;color:var(--sf-navy);margin-top:2px;}
    .sf-rubro-tile-count{font-size:.62rem;color:var(--sf-muted);margin-top:2px;}
    .sf-rows{padding:0 18px 24px;}
    .sf-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--sf-border);}
    .sf-row:last-child{border-bottom:none;}
    .sf-row-left{display:flex;flex-direction:column;gap:1px;min-width:0;}
    .sf-row-name{font-size:.82rem;font-weight:600;color:var(--sf-ink);}
    .sf-row-meta{font-size:.68rem;color:var(--sf-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .sf-row-price{font-family:var(--sf-font-display);font-weight:700;color:var(--sf-accent);font-size:.86rem;white-space:nowrap;}
    .sf-row-add{background:none;border:none;color:var(--sf-accent);font-weight:700;font-size:.78rem;text-decoration:underline;cursor:pointer;white-space:nowrap;}
    html[data-sf-engine] .sf-row .cart-add-mini{width:auto;flex:0 0 auto;}
    html[data-storefront-theme="oferta_primero"] .cart-head{background:var(--sf-navy);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
    html[data-storefront-theme="oferta_primero"] .cart-head h2{color:#fff;}
    html[data-storefront-theme="oferta_primero"] .cart-head p{color:#c7d3e6;}
    html[data-storefront-theme="oferta_primero"] .sf-products-head{background:var(--sf-navy);}
    html[data-storefront-theme="oferta_primero"] .sf-products-head .sf-products-title,
    html[data-storefront-theme="oferta_primero"] .sf-products-head .sf-products-subtitle{color:#fff;}
    html[data-storefront-theme="oferta_primero"] .sf-search{background:#fff;}
    /* Combos + pedido directo: botón "+" y CTAs en verde, no en rojo */
    html[data-storefront-theme="combos_pedido_directo"] .cart-grid-step--plus{background:var(--sf-wa);}
    html[data-storefront-theme="combos_pedido_directo"] .sf-combo-add{background:var(--sf-wa);}
    html[data-storefront-theme="combos_pedido_directo"] .cart-add-mini{background:var(--sf-wa);}
    /* Motor - Catálogo tipo vidriera: tiles con foto y caption superpuesta */
    .sf-tiles{padding:0 18px 24px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .sf-tile{position:relative;border-radius:14px;overflow:hidden;height:172px;background:var(--sf-thumb-bg);}
    .sf-tile img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
    .sf-tile-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2rem;}
    .sf-tile-caption{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top, rgba(10,46,91,.88), rgba(10,46,91,0));color:#fff;padding:26px 10px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;}
    .sf-tile-name{font-size:.78rem;font-weight:600;color:#fff;line-height:1.25;}
    .sf-tile-price{font-family:var(--sf-font-display);font-weight:700;color:#fff;font-size:.82rem;margin-top:2px;}
    .sf-tile .cart-add-mini.cart-add-mini--stepper{background:rgba(255,255,255,.16);flex:0 0 auto;}
    .sf-tile .cart-grid-step{background:transparent;color:#fff;}
    .sf-tile .cart-grid-step--plus{background:#fff;color:var(--sf-accent);}
    .sf-tile .cart-grid-qty{color:#fff;}
    .sf-tile-caption .cart-add-mini{width:auto!important;flex:0 0 auto;background:#fff;color:var(--sf-accent);font-size:.7rem;padding:6px 10px;}
    .sf-tile-caption .cart-add-mini::before{content:none;}

<body>
  <div id="app" class="page"><div class="disabled"><h1>Cargando web...</h1><p>Estamos preparando la vidriera online.</p></div></div>

  <script type="module">
    import { resolveSession } from "./js/services/auth-service.js";
    import { db, getBusinessMetaPath, getBusinessStatePath, readPath } from "./js/core/firebase-core.js";
    import { getProductThumbnailPath } from "./js/services/product-image-service.js";
    import { buildStorefrontHighlights, toHighlight } from "./js/services/storefront-highlights-service.js";
    import { createStarterProducts } from "./js/data/starter-products.js";
    import {
      loadActivationDraft,
      setActivationDraftStep
    } from "./js/services/activation-draft-service.js";
    import { initFunnelTracking, trackFunnelEvent } from "./js/services/funnel-tracking-service.js";
    import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const params = new URLSearchParams(location.search);
    const app = document.getElementById("app");

    function esc(v=""){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    function money(v){return new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(Number(v||0))}
    function whatsappIconSvg(){
      return `<svg class="wa-brand-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="15"/><path d="M23.48 8.52A10.45 10.45 0 0 0 16.04 5.5C10.27 5.5 5.58 10.18 5.58 15.95c0 1.84.48 3.64 1.39 5.22L5.5 26.5l5.46-1.43a10.46 10.46 0 0 0 5.07 1.29h.01c5.77 0 10.46-4.69 10.46-10.46 0-2.79-1.08-5.41-3.02-7.38Zm-7.44 16.07h-.01a8.67 8.67 0 0 1-4.42-1.21l-.32-.19-3.24.85.87-3.15-.21-.33a8.66 8.66 0 1 1 7.33 4.03Zm4.75-6.49c-.26-.13-1.54-.76-1.78-.85-.24-.09-.41-.13-.59.13-.17.26-.67.85-.83 1.02-.15.17-.3.2-.56.07-.26-.13-1.1-.4-2.09-1.29-.77-.69-1.3-1.54-1.45-1.8-.15-.26-.02-.4.11-.53.12-.12.26-.3.39-.46.13-.15.17-.26.26-.43.09-.17.04-.33-.02-.46-.07-.13-.59-1.41-.8-1.93-.21-.51-.43-.44-.59-.45h-.5c-.17 0-.46.07-.7.33-.24.26-.91.89-.91 2.17 0 1.28.93 2.52 1.06 2.69.13.17 1.83 2.8 4.44 3.93.62.27 1.1.43 1.48.55.62.2 1.19.17 1.64.1.5-.07 1.54-.63 1.76-1.24.22-.61.22-1.13.15-1.24-.06-.11-.24-.17-.5-.3Z"/></svg>`;
    }
    function getTotal(c={}){return Number(c.total||c.finalTotal||c?.snapshot?.totals?.total_redondeado||c?.snapshot?.totals?.total||0)}
    function icon(rubro="",name=""){const t=(rubro+" "+name).toLowerCase(); if(t.includes("pollo")) return "🐔"; if(t.includes("cerdo")) return "🐖"; if(t.includes("novillo")||t.includes("vaca")) return "🐄"; return "🥩"}
    function normalizePhone(v=""){
      let p=String(v||"").replace(/\D/g,"").replace(/^00+/,"");
      if(!p) return "";
      if(p.startsWith("54")) p=p.slice(2);
      if(p.startsWith("9")&&p.length===11) p=p.slice(1);
      p=p.replace(/^0+/,"");
      if(p.startsWith("11")){
        let rest=p.slice(2); if(rest.startsWith("15")) rest=rest.slice(2); p="11"+rest;
      }else if(p.length>=10){
        let area=p.slice(0,4),rest=p.slice(4); if(rest.startsWith("15")) rest=rest.slice(2); p=area+rest;
      }
      return p.length===10?"549"+p:"54"+p;
    }
    function waLink(meta={},text=""){const phone=normalizePhone(meta.telefono||meta.phone||meta.whatsapp||meta.phoneKey||""); return phone ? `https://wa.me/${phone}?text=${encodeURIComponent(text)}` : `https://wa.me/?text=${encodeURIComponent(text)}`}
    function normalizeSlug(value=""){return String(value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60)}
    function publicBusinessName(value=""){const clean=String(value||"").trim().replace(/\s+/g," "); const without=clean.replace(/^(carnicer[ií]a\s*)+/i,"").trim(); const base=without||clean||"Carnicería"; return (/^carnicer[ií]a\b/i.test(base)?base:`Carnicería ${base}`).trim().replace(/\s+/g," ");}
    function businessShortName(value=""){return String(publicBusinessName(value)).replace(/^Carnicer[ií]a\s+/i,"").trim()||"Carnicería"}
    function validPublicPrice(product={}){const value=Number(product.precio ?? product.price ?? 0); return Number.isFinite(value)&&value>0;}
    const OFFER_CATEGORIES=["2 Kgs","3 Kgs","5 Kgs","10 Kgs","Pieza Entera"];
    function normalizeOfferCategory(value=""){
      const raw=String(value||"").trim().toLowerCase();
      if(!raw) return "";
      if(/pieza|entera|pieza entera/.test(raw)) return "Pieza Entera";
      if(/(^|\D)10(\D|$)/.test(raw)) return "10 Kgs";
      if(/(^|\D)5(\D|$)/.test(raw)) return "5 Kgs";
      if(/(^|\D)3(\D|$)/.test(raw)) return "3 Kgs";
      if(/(^|\D)2(\D|$)/.test(raw)) return "2 Kgs";
      return "";
    }
    function inferOfferCategory(combo={}){
      const explicit=normalizeOfferCategory(combo.category||combo.categoria||combo.offerCategory||combo.categoriaOferta||"");
      if(explicit) return explicit;
      const title=normalizeOfferCategory(combo.name||combo.nombre||"");
      if(title) return title;
      const items=Array.isArray(combo.items)?combo.items:[];
      const pieceText=items.map(i=>`${i.unidad||""} ${i.nombre||i.name||""}`).join(" ").toLowerCase();
      if(/pieza|entera|unidad entera/.test(pieceText)) return "Pieza Entera";
      let totalKg=0;
      let allKg=items.length>0;
      for(const item of items){
        const unit=String(item.unidad||"kg").trim().toLowerCase();
        const qty=Number(item.cantidad ?? 1);
        if(!Number.isFinite(qty)){allKg=false;break;}
        if(unit==="kg"||unit==="kgs"||unit==="kilo"||unit==="kilos"){
          totalKg+=qty;
        }else{
          allKg=false;
          break;
        }
      }
      if(allKg){
        const rounded=Math.round(totalKg*100)/100;
        if(rounded===2) return "2 Kgs";
        if(rounded===3) return "3 Kgs";
        if(rounded===5) return "5 Kgs";
        if(rounded===10) return "10 Kgs";
      }
      return "";
    }
    function inferOfferRubro(combo={}){
      const items=Array.isArray(combo.items)?combo.items:[];
      const rubros=[...new Set(items.map(item=>String(item.rubro||item.category||item.categoria||"").trim()).filter(Boolean))];
      if(rubros.length>1)return "Mixtas";
      return rubros[0]||"Otros";
    }
    function getSlugFromPath(){const parts=location.pathname.split("/").filter(Boolean); const last=parts[parts.length-1]||""; if(!last||last.includes(".")||["app","admin","index"].includes(last)) return ""; return normalizeSlug(last)}

    function applyBusinessTabIdentity(name="Carnicería",logoUrl=""){
      const cleanName=String(name||"Carnicería").trim()||"Carnicería";
      document.title=`${cleanName} | Carnis.app`;
      const favicon=document.getElementById("businessFavicon");
      if(!favicon)return;
      const fallback="/assets/brand/carnis/app-icons/carnis-icon-48.png";
      const candidate=String(logoUrl||"").trim();
      if(!candidate){favicon.href=fallback;return;}
      const probe=new Image();
      probe.onload=()=>{favicon.href=candidate;};
      probe.onerror=()=>{favicon.href=fallback;};
      probe.src=candidate;
    }

    // V12.27-A5.3 - preview temporal del onboarding sin Firebase/Auth.
    function isActivationPreview(){
      return params.get("preview")==="activation";
    }

    function starterProductKey(product={}){
      return String(product.productKey||product.id||"").trim();
    }

    function buildActivationPreviewPayload(draft={}){
      const selectedRubros=new Set(
        Array.isArray(draft?.selectedRubros)
          ? draft.selectedRubros.map((value)=>String(value||"").trim()).filter(Boolean)
          : []
      );
      const prices=(draft?.prices&&typeof draft.prices==="object"&&!Array.isArray(draft.prices))
        ? draft.prices
        : {};

      const publicProducts=createStarterProducts()
        .filter((product)=>!selectedRubros.size||selectedRubros.has(String(product.rubro||"").trim()))
        .map((product)=>{
          const key=starterProductKey(product);
          const price=Number(prices[key]||0);
          return {
            id:product.id||key||product.nombre||"",
            productKey:key,
            nombre:product.nombre||product.name||"Producto",
            rubro:String(product.rubro||"Sin rubro").trim()||"Sin rubro",
            precio:Number.isFinite(price)&&price>0?price:0
          };
        })
        .filter((product)=>validPublicPrice(product));

      function previewStableScore(product={}){
        const text=String(product.productKey||product.id||product.nombre||"");
        let hash=2166136261;
        for(let i=0;i<text.length;i++){
          hash^=text.charCodeAt(i);
          hash=Math.imul(hash,16777619);
        }
        return hash>>>0;
      }

      const promoCandidates=[...publicProducts]
        .sort((a,b)=>previewStableScore(a)-previewStableScore(b))
        .slice(0,3);

      const discountedPrice=(price)=>Math.max(1,Math.round((Number(price)||0)*0.90));
      const previewOfferFor=(product,index)=>({
        id:`preview-promo-${index+1}`,
        name:`Promo 10% · ${product.nombre}`,
        category:"1 kg",
        total:discountedPrice(product.precio),
        items:[{
          nombre:product.nombre,
          rubro:product.rubro,
          cantidad:1,
          unidad:"kg"
        }]
      });

      const publicOffers=promoCandidates.slice(1,3).map((product,index)=>previewOfferFor(product,index));
      const dailyProduct=promoCandidates[0]||null;
      const dailyOffers=dailyProduct?[{
        id:"preview-daily-1",
        name:`Promo del día · ${dailyProduct.nombre}`,
        status:"active",
        expiresAt:new Date(Date.now()+24*60*60*1000).toISOString(),
        total:discountedPrice(dailyProduct.precio),
        items:[{
          nombre:dailyProduct.nombre,
          rubro:dailyProduct.rubro,
          cantidad:1,
          unidad:"kg"
        }]
      }]:[];

      const businessName=String(draft?.identity?.businessName||"Tu carnicería").trim()||"Tu carnicería";
      const locality=String(draft?.identity?.locality||"").trim();
      const province=String(draft?.identity?.province||"").trim();
      const phone=String(draft?.publish?.telefono||"").trim();

      return {
        __activationPreview:true,
        businessId:"",
        slug:"",
        active:true,
        enabled:true,
        published:true,
        mode:"activation_preview",
        priceListStatus:"ready",
        businessName,
        publicDisplayName:businessName,
        address:"",
        city:locality,
        province,
        phone,
        phoneKey:"",
        whatsapp:phone,
        logoUrl:"",
        frontPhotoUrl:"",
        showPriceList:true,
        publicRubroNames:{Novillo:"Ternera/Vaca"},
        storefrontTheme:"directo_al_grano",
        publicOffers,
        dailyOffers,
        publicProducts
      };
    }

    function renderActivationPreviewBar(){
      if(!isActivationPreview())return;
      document.querySelector("[data-activation-preview-bar]")?.remove();

      const bar=document.createElement("div");
      bar.dataset.activationPreviewBar="true";
      bar.style.cssText="position:sticky;top:0;z-index:9999;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:#B3161A;color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.18);font-family:inherit;";
      bar.innerHTML=`
        <div style="display:flex;align-items:center;gap:9px;min-width:0;">
          <img src="/assets/characters/carniza/onboarding/carniza-onboarding-preview.webp" alt="Carniza" style="width:44px;height:44px;object-fit:contain;flex:0 0 auto;">
          <div style="min-width:0;">
            <strong style="display:block;font-size:14px;line-height:1.15;">Vista previa</strong>
            <small style="display:block;opacity:.9;line-height:1.2;">Así van a ver tu carnicería tus clientes.</small>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;">
          <button type="button" data-activation-preview-back style="flex:0 0 auto;min-height:38px;padding:0 12px;border:0;border-radius:11px;background:#fff;color:#B3161A;font-weight:1000;cursor:pointer;">← Seguir editando</button>
          <button type="button" data-activation-preview-publish style="flex:0 0 auto;min-height:38px;padding:0 13px;border:0;border-radius:11px;background:#16a34a;color:#fff;font-weight:1000;cursor:pointer;box-shadow:0 8px 20px rgba(22,163,74,.24);">Publicar mi carnicería</button>
        </div>
      `;
      bar.querySelector("[data-activation-preview-back]")?.addEventListener("click",()=>{
        try{setActivationDraftStep("identity")}catch(_){}
        location.href="/crear-carniceria.html?resume=1";
      });
      bar.querySelector("[data-activation-preview-publish]")?.addEventListener("click",()=>{
        try{setActivationDraftStep("publish")}catch(_){}
        location.href="/crear-carniceria.html?publish=1";
      });
      document.body.prepend(bar);
    }

    // V12.13-C4-FIX1 - slug como índice: la web lee precios vivos desde meta/state
    async function resolveWebSource(){
      if(isActivationPreview()){
        const draft=loadActivationDraft();
        if(!draft){
          return {type:"activation_preview_missing"};
        }
        // Tracking Comercial V1: solo la vista previa del onboarding; la vidriera pública no se toca.
        initFunnelTracking({page:"preview"});
        void trackFunnelEvent("storefront_previewed");
        return {
          type:"activation_preview",
          data:buildActivationPreviewPayload(draft)
        };
      }
      const legacyId=params.get("biz")||params.get("businessId")||"";
      const slug=normalizeSlug(params.get("slug")||getSlugFromPath()||"");

      if(slug){
        const indexed=await getDoc(doc(db,"publicWebSlugs",slug));
        if(indexed.exists() && indexed.data()?.businessId){
          let publicIndex = indexed.data() || {};
          let resolvedSlug = slug;
          const visited = new Set([slug]);
          const MAX_ALIAS_HOPS = 4;

          // RC5: resolver cadenas históricas A -> B -> C sin usar snapshots.
          // Cada salto debe conservar el mismo businessId; ciclos y cadenas
          // excesivas fallan de forma explícita en vez de mostrar una vidriera vacía.
          for(let hop=0; hop<MAX_ALIAS_HOPS; hop++){
            let nextSlug = normalizeSlug(publicIndex.aliasOf || "");

            // Compatibilidad RC3: alias-snapshot cuyo campo slug apuntaba al canónico.
            if(!nextSlug && publicIndex.createdFrom === "slug_alias"){
              const rc3Canonical = normalizeSlug(publicIndex.slug || "");
              if(rc3Canonical && rc3Canonical !== resolvedSlug) nextSlug = rc3Canonical;
            }

            if(!nextSlug || nextSlug === resolvedSlug) break;
            if(visited.has(nextSlug)){
              throw new Error("Detectamos un ciclo en los enlaces históricos de esta carnicería.");
            }
            visited.add(nextSlug);

            const target = await getDoc(doc(db,"publicWebSlugs",nextSlug));
            if(!target.exists() || !target.data()?.businessId){
              throw new Error(`El enlace histórico "${slug}" apunta a una vidriera que ya no está disponible.`);
            }
            const targetData = target.data() || {};
            if(String(targetData.businessId||"") !== String(indexed.data()?.businessId||"")){
              throw new Error("El alias público no coincide con la carnicería canónica.");
            }
            publicIndex = targetData;
            resolvedSlug = nextSlug;
          }

          const stillAlias = normalizeSlug(publicIndex.aliasOf || "");
          if(stillAlias && stillAlias !== resolvedSlug){
            throw new Error("El enlace histórico supera el límite seguro de resolución.");
          }

          return {
            type:"public",
            slug: resolvedSlug,
            requestedSlug: slug,
            businessId: publicIndex.businessId,
            data:{ ...publicIndex, slug: resolvedSlug }
          };
        }

        if(!legacyId){
          throw new Error(
            `No encontramos una carnicería publicada con el link "${slug}". ` +
            `Si sos el dueño: entrá a la app y revisá la sección Mi Web.`
          );
        }
      }

      if(legacyId) return { type:"legacy", businessId:legacyId };
      throw new Error("Falta identificar la carnicería. Usá un link público válido.");
    }

    async function shouldTrackPublicWebView(data={}){
      try{
        const session=await resolveSession();

        if(session?.appMode==="superadmin") return false;

        if(
          session?.appMode==="client" &&
          String(session.businessId||"") &&
          String(session.businessId||"")===String(data.businessId||"")
        ){
          return false;
        }

        return true;
      }catch(error){
        console.warn("No se pudo resolver sesion para analytics publico",error);
        // Ante una sesión indeterminada se excluye la señal para evitar contar
        // por error una inspección del dueño o del superadmin como visita externa.
        return false;
      }
    }

    function publicSignalVisitorId(){
      const key="apppromos_public_signal_visitor_v1";
      try{
        const current=localStorage.getItem(key);
        if(current)return current;
        const created=(globalThis.crypto?.randomUUID?.()||`${Date.now()}${Math.random()}`)
          .replace(/[^a-zA-Z0-9]/g,"").slice(0,32);
        localStorage.setItem(key,created);
        return created;
      }catch(_){
        return `session${Date.now()}${Math.random().toString(16).slice(2)}`.slice(0,32);
      }
    }

    async function recordPublicSignal(data={},type="",metadata={},eligible=false){
      const businessId=String(data.businessId||"").trim();
      if(!businessId||eligible!==true)return false;
      const allowedTypes=new Set(["external_storefront_visit","public_order_whatsapp_started"]);
      if(!allowedTypes.has(type))return false;
      const day=new Date().toISOString().slice(0,10).replaceAll("-","");
      const visitorId=publicSignalVisitorId();
      const signalId=`${type}_${day}_${visitorId}`.slice(0,120);
      const localKey=`apppromos_public_signal_${businessId}_${signalId}`;
      try{
        if(localStorage.getItem(localKey)==="1")return false;
        const cleanMetadata={};
        if(Number.isFinite(Number(metadata.itemCount)))cleanMetadata.itemCount=Math.max(0,Math.min(99,Math.trunc(Number(metadata.itemCount))));
        if(typeof metadata.containsOffer==="boolean")cleanMetadata.containsOffer=metadata.containsOffer;
        if(typeof metadata.containsDailyOffer==="boolean")cleanMetadata.containsDailyOffer=metadata.containsDailyOffer;
        await setDoc(doc(db,"businesses",businessId,"publicSignals",signalId),{
          businessId,
          type,
          occurredAt:new Date().toISOString(),
          createdAt:serverTimestamp(),
          origin:"public_web",
          source:type==="external_storefront_visit"?"storefront_load":"public_cart",
          metadata:cleanMetadata,
          schemaVersion:1
        });
        localStorage.setItem(localKey,"1");
        return true;
      }catch(error){
        // La señal es auxiliar: nunca debe impedir que la vidriera o WhatsApp funcionen.
        console.warn("No se pudo registrar señal pública anónima",{type,code:error?.code||"unknown"});
        return false;
      }
    }

    function buildPayloadFromPrivateData(meta={},state={},businessId=""){
      const web=state?.web||{};
      const rawName=web.publicDisplayName||meta.publicDisplayName||meta.publicName||meta.name||meta.nombre||"Carnicería";
      const isStarter=web.mode==="starter" || web.priceListStatus==="pending_real_prices";
      const canShowRealPrices=!isStarter && (!web.priceListStatus || web.priceListStatus==="confirmed" || web.priceListStatus==="ready");
      const selected=new Set(Array.isArray(web.selectedOffers)?web.selectedOffers.map(String):[]);
      const allCombos=Array.isArray(state?.savedCombos)?state.savedCombos:[];
      const publicOffers=isStarter ? [] : allCombos.filter(c=>selected.has(String(c.id||c.comboId||""))).map(c=>({
        id:String(c.id||c.comboId||c.name||""),
        name:c.name||c.nombre||"Oferta",
        category:c.category||c.categoria||c.offerCategory||c.categoriaOferta||"",
        total:getTotal(c),
        items:Array.isArray(c.items)?c.items.map(i=>({nombre:i.nombre||i.name||"Producto",rubro:i.rubro||"",cantidad:i.cantidad||1,unidad:i.unidad||"kg"})):[]
      }));
      const visibleRubros=new Set(Array.isArray(web.visibleRubros)?web.visibleRubros:[]);
      const products=(web.showPriceList&&canShowRealPrices&&Array.isArray(state?.products)?state.products:[])
        .filter(p=>p.active!==false && validPublicPrice(p))
        .map(p=>({id:p.id||p.nombre||p.name||"",nombre:p.nombre||p.name||"Producto",rubro:String(p.rubro||"Sin rubro").trim()||"Sin rubro",precio:Number(p.precio ?? p.price ?? 0)}))
        .filter(p=>!visibleRubros.size || visibleRubros.has(p.rubro));

      return {
        businessId,
        slug:web.slug||"",
        active:Boolean(meta?.webPremiumEnabled) && Boolean(web.enabled) && web.active!==false && web.published!==false,
        enabled:Boolean(web.enabled),
        published:web.published!==false,
        mode:web.mode||"web_premium",
        priceListStatus:web.priceListStatus||"",
        businessName:rawName,
        publicDisplayName:rawName,
        address:meta.direccion||meta.address||"",
        city:meta.localidad||meta.ciudad||meta.city||meta.locality||"",
        province:meta.provincia||meta.province||"",
        phone:meta.telefono||meta.phone||"",
        phoneKey:meta.phoneKey||"",
        whatsapp:meta.phoneKey||meta.telefono||meta.phone||"",
        logoUrl:meta?.brand?.logoUrl||"",
        frontPhotoUrl:meta?.brand?.frontPhotoUrl||"",
        showPriceList:Boolean(web.showPriceList)&&canShowRealPrices,
        publicRubroNames:{Novillo:String(web?.publicRubroNames?.Novillo||"Novillo").trim()||"Novillo"},
        storefrontTheme:String(web?.storefrontTheme||"standard").trim()||"standard",
        publicOffers,
        publicProducts:products
      };
    }

    async function loadPayload(source){
      if(source.type==="activation_preview"){
        return source.data;
      }
      if(source.type==="activation_preview_missing"){
        throw new Error("La vista previa venció o ya no está disponible. Volvé al onboarding para continuar.");
      }
      if(source.type==="public"){
        // V12.18 QA-PROD01-FIX1: snapshot público autosuficiente.
        return source.data;
      }
      const [meta,state]=await Promise.all([readPath(getBusinessMetaPath(source.businessId)), readPath(getBusinessStatePath(source.businessId))]);
      return buildPayloadFromPrivateData(meta||{},state||{},source.businessId);
    }

    // V12.13-C2-FIX2 - imagen generica por titulo de combo/oferta
    function comboCover(combo={}){
      const items = Array.isArray(combo.items) ? combo.items : [];
      const text = `${combo.name||combo.nombre||""} ${items.map(i=>`${i.nombre||i.name||""} ${i.rubro||""}`).join(" ")}`
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase();
      const base = "/assets/web-arranque/combo-covers/";
      if(/mila|milanesa/.test(text)) return base+"combo-milanesas.webp";
      if(/achura|morcilla|chinchulin|chinchu/.test(text)) return base+"combo-achuras.webp";
      if(/parrilla|parrillero|asado|fuego|finde/.test(text)) return base+"combo-parrilla.webp";
      if(/familiar|familia/.test(text)) return base+"combo-familiar.webp";
      if(/cerdo|bondiola|matambrito|pechito/.test(text)) return base+"combo-cerdo.webp";
      if(/pollo|suprema|pata|muslo|alita/.test(text)) return base+"combo-pollo.webp";
      if(/picada/.test(text)) return base+"combo-picada.webp";
      if(/novillo|vacio|entrana|entrana|marucha|matambre|nalga|cuadrada|roast/.test(text)) return base+"combo-novillo.webp";
      if(/oferta|promo|combo|dia|hoy|salvaventas/.test(text)) return base+"combo-oferta-dia.webp";
      return base+"combo-default.webp";
    }
    async function renderWeb(data={}){

        ? false

      if(trackExternalAnalytics){
        if(typeof window.gtag==="function"){
          window.gtag("event","public_web_view",{
            business_id:String(data.businessId||""),

          });

      }

      const rawName=data.publicDisplayName||data.businessName||data.publicName||data.name||data.nombre||"Carnicería";

      const savedStorefrontTheme=String(data.storefrontTheme||"").trim();
      const isStorefrontThemePreview=knownStorefrontThemes.has(previewStorefrontTheme);
      const storefrontTheme=isStorefrontThemePreview
        ? previewStorefrontTheme
        : (knownStorefrontThemes.has(savedStorefrontTheme)?savedStorefrontTheme:"standard");
      document.documentElement.dataset.storefrontTheme=storefrontTheme;
      const engineLayoutThemes=new Set(["directo_al_grano","oferta_primero","catalogo_vidriera","combos_pedido_directo"]);
      const isEngineLayout=engineLayoutThemes.has(storefrontTheme);
      if(isEngineLayout){document.documentElement.dataset.sfEngine="1";}
      let engineActiveRubro="";
      let engineProductsActiveRubro="";
      let engineProductsSearch="";
      let engineOfferFilter="Todas";
      const name=publicBusinessName(rawName);
      const shortName=businessShortName(rawName);
      const isStarter=data.mode==="starter" || data.priceListStatus==="pending_real_prices";
      const city=data.city||data.localidad||data.ciudad||data.locality||"";
      const province=data.province||data.provincia||"";
      const address=data.address||data.direccion||"";
      const phone=data.phone||data.telefono||data.whatsapp||data.phoneKey||"";
      const logoUrl=String(data.logoUrl||data.brand?.logoUrl||"").trim();
      const frontPhotoUrl=String(data.frontPhotoUrl||data.brand?.frontPhotoUrl||"").trim();
      applyBusinessTabIdentity(name,logoUrl);
      const combos=Array.isArray(data.publicOffers)?data.publicOffers:[];
      const dailyOffers=(Array.isArray(data.dailyOffers)?data.dailyOffers:[]).filter((offer)=>offer?.status==="active"&&Date.parse(offer.expiresAt||"")>Date.now());
      const genericDailyOfferNames=new Set(["oferta","promo","oferta-del-dia","promo-del-dia","oferta-de-hoy","promo-de-hoy","vender-urgente"]);
      function dailyOfferId(offer={},index=0){return offer.id||offer.offerId||offer.name||offer.nombre||(`daily-${index}`)}
      function dailyOfferDisplayName(offer={}){
        const rawName=String(offer.name||offer.nombre||"").trim();
        if(rawName&&!genericDailyOfferNames.has(normalizeSlug(rawName)))return rawName;
        const parts=(Array.isArray(offer.items)?offer.items:[]).filter(part=>String(part?.nombre||part?.name||"").trim());
        const names=[...new Set(parts.map(part=>String(part.nombre||part.name||"Producto").trim()))];
        if(parts.length===1){
          const part=parts[0];
          const quantity=Number(part.cantidad??part.quantity??1);
          const amount=Number.isFinite(quantity)?quantity.toLocaleString("es-AR",{maximumFractionDigits:2}):"1";
          const rawUnit=String(part.unidad||part.unit||"kg").trim().toLowerCase();
          const unit=/^(kg|kgs|kilo|kilos)$/.test(rawUnit)?"kg":(rawUnit||"unidad");
          return `${amount} ${unit} de ${names[0]}`;
        }
        if(names.length===2)return `${names[0]} y ${names[1]}`;
        if(names.length>2){
          const visible=names.slice(0,3);
          const list=visible.length===3?`${visible[0]}, ${visible[1]} y ${visible[2]}`:visible.join(" y ");
          return `Combo del día: ${list}${names.length>3?" y más":""}`;
        }
        return "Oferta de hoy";
      }
      const products=(Array.isArray(data.publicProducts)?data.publicProducts:[]).filter(p=>validPublicPrice(p));
      const rubroNames=[...new Set(products.map(p=>String(p.rubro||"Sin rubro").trim()||"Sin rubro"))].sort((a,b)=>a.localeCompare(b,"es"));
      const publicNovilloName=String(data?.publicRubroNames?.Novillo||"Novillo").trim()||"Novillo";
      function publicRubroName(rubro=""){return rubro==="Novillo"?publicNovilloName:rubro}
      function offerRubroLabel(rubro=""){
        if(rubro==="Mixtas")return "Mixtas";
        if(rubro==="Otros")return "Otros";
        return publicRubroName(rubro);
      }
      const offerCategoriesAvailable=OFFER_CATEGORIES.filter(category=>combos.some(combo=>inferOfferCategory(combo)===category));
      const OFFER_RUBRO_ORDER=["Novillo","Cerdo","Pollo","Mixtas"];
      const inferredOfferRubros=[...new Set(combos.map(combo=>inferOfferRubro(combo)))];
      const offerRubrosAvailable=[
        ...OFFER_RUBRO_ORDER.filter(rubro=>inferredOfferRubros.includes(rubro)),
        ...inferredOfferRubros.filter(rubro=>!OFFER_RUBRO_ORDER.includes(rubro)&&rubro!=="Otros"),
        ...(inferredOfferRubros.includes("Otros")?["Otros"]:[])
      ];
      const randomize=(items=[])=>items.map(item=>({item,sort:Math.random()})).sort((a,b)=>a.sort-b.sort).map(entry=>entry.item);
      const productAnchorId=(product={},index=0)=>`producto-${normalizeSlug(`${product.rubro||"corte"}-${product.id||product.nombre||index}`)}`;
      const promoAnchorId=(combo={},index=0)=>`promo-${normalizeSlug(combo.id||combo.comboId||combo.name||combo.nombre||index)}`;
      const dailyAnchorId=(offer={},index=0)=>`oferta-${normalizeSlug(dailyOfferId(offer,index))}`;
      const showcaseRubros=new Set(["novillo","cerdo","pollo"]);
      function findCatalogProductForShowcaseItem(item={}){
        const itemIds=[
          item.productId,
          item.productoId,
          item.catalogProductId,
          item.catalogId,
          item.id
        ].filter(value=>value!==undefined&&value!==null&&String(value).trim()!=="").map(value=>String(value).trim());

        if(itemIds.length){
          const byId=products.find(product=>{
            const productIds=[product.id,product.productId,product.productoId]
              .filter(value=>value!==undefined&&value!==null&&String(value).trim()!=="")
              .map(value=>String(value).trim());
            return productIds.some(id=>itemIds.includes(id));
          });
          if(byId)return byId;
        }

        const itemName=normalizeSlug(item.nombre||item.name||"");
        const itemRubro=normalizeSlug(item.rubro||item.category||item.categoria||"");
        if(!itemName)return null;

        if(itemRubro){
          const exactNameAndRubro=products.find(product=>
            normalizeSlug(product.nombre||product.name||"")===itemName &&
            normalizeSlug(product.rubro||product.category||product.categoria||"")===itemRubro
          );
          if(exactNameAndRubro)return exactNameAndRubro;
        }

        return products.find(product=>normalizeSlug(product.nombre||product.name||"")===itemName)||null;
      }

      function showcaseImageForSingleProduct(commercialPiece={},item={}){
        const catalogProduct=findCatalogProductForShowcaseItem(item);
        const realImage=catalogProduct?getProductThumbnailPath(catalogProduct):"";
        return realImage||comboCover(commercialPiece);
      }

      const productShowcaseCandidates=randomize(
        products
          .filter(product=>showcaseRubros.has(String(product.rubro||"").trim().toLocaleLowerCase("es-AR")))
          .map((product,index)=>({
            kind:"product",
            view:"products",
            name:product.nombre||"Producto",
            meta:publicRubroName(String(product.rubro||"Sin rubro").trim()||"Sin rubro"),
            rubro:String(product.rubro||"Sin rubro").trim()||"Sin rubro",
            price:Number(product.precio??product.price??0),
            priceSuffix:"/kg",
            image:getProductThumbnailPath(product),
            anchor:productAnchorId(product,products.indexOf(product)),
            key:`product-${product.id||product.nombre||index}`
          }))
          .filter(item=>item.image)
      );

      const promoShowcaseCandidates=randomize(
        combos
          .map((combo,index)=>({combo,index,items:Array.isArray(combo.items)?combo.items:[]}))
          .filter(entry=>entry.items.length===1)
          .map(({combo,index,items})=>{
            const item=items[0]||{};
            const itemName=String(item.nombre||item.name||"Producto").trim()||"Producto";
            const itemRubro=String(item.rubro||"").trim();
            return {
              kind:"promo",
              view:"promos",
              badge:"PROMO",
              name:String(combo.name||combo.nombre||"Promo").trim()||"Promo",
              meta:itemRubro?`${itemName} · ${publicRubroName(itemRubro)}`:itemName,
              price:getTotal(combo),
              priceSuffix:"",
              image:showcaseImageForSingleProduct(combo,item),
              anchor:promoAnchorId(combo,index),
              key:`promo-${combo.id||combo.comboId||combo.name||index}`
            };
          })
      ).slice(0,2);

      const dailyShowcaseCandidates=randomize(
        dailyOffers
          .map((offer,index)=>({offer,index,items:Array.isArray(offer.items)?offer.items:[]}))
          .filter(entry=>entry.items.length===1)
          .map(({offer,index,items})=>{
            const item=items[0]||{};
            const itemName=String(item.nombre||item.name||"Producto").trim()||"Producto";
            const itemRubro=String(item.rubro||"").trim();
            return {
              kind:"daily",
              view:"daily",
              badge:"OFERTA",

              meta:itemRubro?`${itemName} · ${publicRubroName(itemRubro)}`:itemName,
              price:getTotal(offer),
              priceSuffix:"",
              image:showcaseImageForSingleProduct(offer,item),
              anchor:dailyAnchorId(offer,index),
              key:`daily-${dailyOfferId(offer,index)}`

      /* V12.25-C — la urgencia vive dentro del carrusel.
         Las Ofertas de Hoy se intercalan y pueden repetirse para ganar frecuencia visual,
         sin agregar un banner extra en Inicio. */
      const dailyShowcaseSequence=dailyShowcaseCandidates.length
        ? Array.from({length:3},(_,index)=>dailyShowcaseCandidates[index%dailyShowcaseCandidates.length])

      pushShowcaseItem(productShowcaseCandidates[1]);
      pushShowcaseItem(dailyShowcaseSequence[2]);

      const savedViewState=loadViewState();

        return match?{...item,name:dailyOfferDisplayName(match)}:item;
      });
      function loadCartItems(){try{const parsed=JSON.parse(localStorage.getItem(cartKey)||"[]");return Array.isArray(parsed)?parsed:[]}catch(error){return[]}}
      function saveCartItems(){try{localStorage.setItem(cartKey,JSON.stringify(cartItems))}catch(error){console.warn("No se pudo guardar el carrito",error)}}
      function loadRememberedCustomer(){try{const raw=localStorage.getItem(customerKey);if(!raw)return null;const parsed=JSON.parse(raw);return parsed&&typeof parsed==="object"?{name:String(parsed.name||""),phone:String(parsed.phone||"")}:null}catch(error){return null}}
      let rememberedCustomer=loadRememberedCustomer();

      function saveRememberedCustomer(customer={}){if(!rememberCustomer)return;rememberedCustomer={name:String(customer.name||"").slice(0,80),phone:String(customer.phone||"").slice(0,40)};try{localStorage.setItem(customerKey,JSON.stringify({version:1,...rememberedCustomer}))}catch(error){console.warn("No se pudieron recordar los datos",error)}}

      function cartNumber(value){const number=Number(value||0);return Number.isFinite(number)?number:0}

      const promosSection=isEngineLayout
        ? enginePromosSectionHtml()

      function engineAboutSectionHtml(){

          address?`<div class="sf-about-row"><span class="sf-about-row-icon">📍</span><span>${esc([address,[city,province].filter(Boolean).join(", ")].filter(Boolean).join(" · "))}</span></div>`:"",

      function engineBannerHtml(){

      function sfMonogramInitials(str=""){
        const stop=new Set(["la","el","los","las","de","del","y","a","en"]);
        const words=String(str||"").trim().split(/\s+/).filter(w=>w&&!stop.has(w.toLowerCase()));

        return source.slice(0,2).map(w=>w.charAt(0).toUpperCase()).join("")||"?";
      }
      function engineHeaderHtml(){

          const desc=items.map(i=>`${esc(i.cantidad??i.quantity??1)} ${esc(i.unidad||i.unit||"kg")} · ${esc(i.nombre||i.name||"Producto")}`).join(" · ");

        })():"";
        const otherCombos=(isStarter?[]:combos).filter(c=>c!==heroC).slice(0,8);
        const hscrollHtml=otherCombos.length?`<div class="sf-section-title">Otros combos</div><div class="sf-hscroll">${otherCombos.map((c)=>{

        }).join("")}</div>`:"";
        const rubroTilesHtml=rubroNames.length?`<div class="sf-section-title">Elegí por rubro</div><div class="sf-rubro-tiles">${rubroNames.slice(0,6).map(r=>{
          const count=products.filter(p=>(String(p.rubro||"Sin rubro").trim()||"Sin rubro")===r).length;
          return `<button type="button" class="sf-rubro-tile" data-store-view-target="products" data-nav-products="true">${icon(r,"")}<div class="sf-rubro-tile-name">${esc(publicRubroName(r))}</div><div class="sf-rubro-tile-count">${count} corte${count===1?"":"s"}</div></button>`;
        }).join("")}</div>`:"";
