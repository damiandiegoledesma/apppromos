<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carnis.app · App</title>
  <meta name="theme-color" content="#0A2E5B" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Carnis.app" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/assets/brand/carnis/app-icons/apple-touch-icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="/assets/brand/carnis/app-icons/favicon.svg" />
  <link rel="icon" href="/assets/brand/carnis/app-icons/favicon.ico" sizes="any" />

  <!-- Estilos Carnis: fuente única (QA-03 C1). Consolida design-system.css, carniza.css,
       app-brand-refresh.css, pwa-install.css, el <style> inline, status-compact.css y carnis-ui.css. -->
  <link rel="stylesheet" href="/styles/carnis.css" />

  <!-- APPPROMOS TRACKING DEMO GA4 C1 → QA-ISO-2: carga centralizada con allowlist de hostnames -->
  <script src="/js/analytics-gate.js"></script>
</head>
<body>
  <!-- MARCO ROJO TOP -->
  <div class="topbar-frame"></div>
  
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-left">
            <span class="app-brand-logo-box" aria-hidden="true">
              <img src="/assets/brand/carnis/svg/carnis-icono-color.svg" alt="" />
            </span>
            <div class="brand-copy">
              <h1><span style="color:#E52223 !important">Carnis</span><span style="color:#0A2E5B !important">.app</span></h1>
            </div>
          </div>

          <div class="brand-right">
            <div id="accessGate"></div>
            <div id="businessSwitcher"></div>
          </div>
        </div>

        <div class="nav-shell">
          <p class="home-note">Acciones rápidas para el mostrador.</p>
          <nav class="nav" id="mainNav">
            <button data-panel="dashboardPanel" class="active">🏠 Inicio</button>
            <button data-panel="pricesPanel">⚡ Cambiar precios</button>
            <button data-panel="builderPanel">🔥 Vender / Crear promo</button>
            <button data-panel="savedPanel">🥩 Promos</button>
            <button data-panel="whatsappPanel">📤 WhatsApp</button>
            <button type="button" data-toggle-more="true">⚙️ Más</button>
          </nav>
          <div class="more-links" id="moreLinks">
            <button data-panel="marketPanel" hidden data-future-feature="competition">📊 Competencia</button>
            <button data-panel="webPanel">🌐 Mi carnicería online</button>
            <button type="button" data-open-how-to-sell>🧭 Cómo vender</button>
            <button data-panel="printPanel">🖨️ Centro de Impresiones</button>
            <button type="button" class="pwa-install-action" data-install-apppromos><img src="/assets/brand/carnis/app-icons/carnis-icon-192.png" alt="" /> <span data-pwa-install-label>INSTALAR</span></button>
            <button data-panel="usersPanel">🛡️ Admin</button>
          </div>
        </div>
      </div>
    </header>

    <section id="dashboardPanel" class="panel panel-scroll-fix active"></section>
    <section id="pricesPanel" class="panel panel-scroll-fix"></section>
    <section id="savedPanel" class="panel panel-scroll-fix"></section>
    <section id="builderPanel" class="panel panel-scroll-fix"></section>
    <section id="usersPanel" class="panel panel-scroll-fix"></section>
    <section id="whatsappPanel" class="panel panel-scroll-fix"></section>
    <section id="marketPanel" class="panel panel-scroll-fix"></section>
    <section id="webPanel" class="panel panel-scroll-fix"></section>
    <section id="printPanel" class="panel panel-scroll-fix"></section>
  </div>

  <!-- MARCO ROJO BOTTOM + FOOTER -->
  <div class="footer-frame"></div>
  <footer class="footer">
    <div style="max-width: 1200px; margin: 0 auto; padding: 0 var(--space-lg);">
      <p style="margin: 0; font-size: 0.85rem; color: #999;">
        © 2026 Carnis.app — una solución de AppPromos. Herramienta para carnicerías en Argentina.
      </p>
    </div>
  </footer>

  <script type="module">
    import { renderBusinessSwitcher } from "./js/modules/business-switcher-module.js";
    import { renderAccessGate } from "./js/modules/access-gate-module.js";

    const accessEl = document.getElementById("accessGate");
    const switcherEl = document.getElementById("businessSwitcher");

    const isLogged = await renderAccessGate(accessEl, {
      // V12.3.1: app.html también funciona como puerta de entrada pública.
      // Si no hay sesión, NO vuelve a index.html: app-main muestra login/registro.
      redirectIfGuest: false,
      loginUrl: "./index.html"
    });

    if (isLogged && switcherEl) {
      await renderBusinessSwitcher(switcherEl);
    }
  </script>



    <script src="./js/vendor/localidades-ar.plugin.js"></script>
    <script type="module" src="./js/app-main.js"></script>
<script src="/js/status-compact.js"></script>
<script type="module" src="/js/pwa-install.js"></script>
</body>
</html>
