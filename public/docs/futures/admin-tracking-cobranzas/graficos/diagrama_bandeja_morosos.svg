<svg width="100%" viewBox="0 0 680 540" role="img">
  <title>Estructura de la bandeja de morosos</title>
  <desc>Vista estructural del panel: filtro, listado de morosos con datos clave, y botones de acción por empresa.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Panel Admin — contenedor principal -->
  <g>
    <rect x="40" y="20" width="600" height="500" rx="12" stroke-width="0.5" fill="#F1EFE8" stroke="#5F5E5A"/>
    <text x="340" y="50" text-anchor="middle" style="font-size:18px;font-weight:500;fill:#2C2C2A">Panel Admin — Bandeja de Morosos</text>
  </g>

  <!-- Filtro/Header -->
  <g>
    <rect x="60" y="70" width="560" height="50" rx="6" stroke-width="0.5" fill="#E6F1FB" stroke="#185FA5"/>
    <text x="340" y="105" text-anchor="middle" style="font-size:14px;fill:#0C447C">Filtro: Pago = "Vencido" | Orden: Antigüedad (más viejo primero)</text>
  </g>

  <!-- Línea separadora conceptual -->
  <line x1="60" y1="130" x2="600" y2="130" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- Fila 1: Empresa vencida hace 7 días -->
  <g>
    <rect x="60" y="140" width="560" height="90" rx="6" fill="white" stroke="#B4B2A9" stroke-width="0.5"/>
    
    <!-- Datos humanos: izquierda -->
    <text x="80" y="160" style="font-size:14px;font-weight:500;fill:#2C2C2A">Carnicería La Estancia</text>
    <text x="80" y="178" style="font-size:12px;fill:#888780">Responsable: Juan García</text>
    <text x="80" y="195" style="font-size:12px;fill:#888780">WhatsApp: 3462543210 | Email: juan@carniceria.com</text>
    
    <!-- Status badge: derecha -->
    <rect x="540" y="150" width="70" height="28" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="575" y="170" text-anchor="middle" style="font-size:12px;font-weight:500;fill:#791F1F">Vencido 7d</text>
    
    <!-- Detalles de pago: segunda línea -->
    <text x="80" y="215" style="font-size:12px;fill:#888780">Plan: Salvador | Monto: $25.000 | Próximo vto: 27 mayo</text>
    
    <!-- Botones de acción: abajo derecha -->
    <rect x="420" y="225" width="180" height="28" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
    <text x="430" y="245" style="font-size:12px;font-weight:500;fill:#2C2C2A">💬 WhatsApp</text>
    <text x="520" y="245" style="font-size:12px;font-weight:500;fill:#2C2C2A">✓ Marcar pago</text>
  </g>

  <!-- Fila 2: Empresa vencida hace 14 días -->
  <g>
    <rect x="60" y="240" width="560" height="90" rx="6" fill="white" stroke="#B4B2A9" stroke-width="0.5"/>
    
    <!-- Datos humanos -->
    <text x="80" y="260" style="font-size:14px;font-weight:500;fill:#2C2C2A">Carnicería del Barrio</text>
    <text x="80" y="278" style="font-size:12px;fill:#888780">Responsable: María López</text>
    <text x="80" y="295" style="font-size:12px;fill:#888780">WhatsApp: 3462554321 | Email: maria@carniceria.com</text>
    
    <!-- Status badge -->
    <rect x="540" y="250" width="70" height="28" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="575" y="270" text-anchor="middle" style="font-size:12px;font-weight:500;fill:#791F1F">Vencido 14d</text>
    
    <!-- Detalles de pago -->
    <text x="80" y="315" style="font-size:12px;fill:#888780">Plan: Arranque | Monto: $15.000 | Próximo vto: 20 mayo</text>
    
    <!-- Botones -->
    <rect x="420" y="325" width="180" height="28" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
    <text x="430" y="345" style="font-size:12px;font-weight:500;fill:#2C2C2A">💬 WhatsApp</text>
    <text x="520" y="345" style="font-size:12px;font-weight:500;fill:#2C2C2A">✓ Marcar pago</text>
  </g>

  <!-- Fila 3: Empresa por vencer (próximamente) -->
  <g>
    <rect x="60" y="340" width="560" height="90" rx="6" fill="white" stroke="#B4B2A9" stroke-width="0.5"/>
    
    <!-- Datos humanos -->
    <text x="80" y="360" style="font-size:14px;font-weight:500;fill:#2C2C2A">Carnicería Don Carlos</text>
    <text x="80" y="378" style="font-size:12px;fill:#888780">Responsable: Carlos Rodríguez</text>
    <text x="80" y="395" style="font-size:12px;fill:#888780">WhatsApp: 3462665432 | Email: carlos@carniceria.com</text>
    
    <!-- Status badge: amarillo (por vencer) -->
    <rect x="540" y="350" width="70" height="28" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="575" y="370" text-anchor="middle" style="font-size:12px;font-weight:500;fill:#633806">Por vencer</text>
    
    <!-- Detalles -->
    <text x="80" y="415" style="font-size:12px;fill:#888780">Plan: Dueño | Monto: $35.000 | Próximo vto: 10 junio (7 días)</text>
    
    <!-- Botones -->
    <rect x="420" y="425" width="180" height="28" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
    <text x="430" y="445" style="font-size:12px;font-weight:500;fill:#2C2C2A">💬 WhatsApp</text>
    <text x="520" y="445" style="font-size:12px;font-weight:500;fill:#2C2C2A">✓ Marcar pago</text>
  </g>

  <!-- Leyenda de colores -->
  <g>
    <text x="60" y="465" style="font-size:12px;font-weight:500;fill:#888780">Estado visual:</text>
    <rect x="60" y="475" width="12" height="12" rx="2" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
    <text x="80" y="484" style="font-size:12px;fill:#888780">Vencido = Rojo</text>
    
    <rect x="240" y="475" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="260" y="484" style="font-size:12px;fill:#888780">Por vencer (próximos 7 días) = Amarillo</text>
  </g>

</svg>
