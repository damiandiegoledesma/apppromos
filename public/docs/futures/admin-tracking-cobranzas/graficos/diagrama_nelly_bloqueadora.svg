<svg width="100%" viewBox="0 0 680 600" role="img">
  <title>La Nelly bloqueadora — Aviso de deuda en la app del carnicero</title>
  <desc>Cómo aparece el aviso de deuda y el botón de pago directo en la aplicación del carnicero cuando la cuota vence.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Título -->
  <text x="340" y="40" text-anchor="middle" style="font-size:18px;font-weight:500;fill:#2C2C2A">La Nelly — Notificación de deuda en la app</text>

  <!-- Simulación de pantalla móvil -->
  <g>
    <!-- Marco del teléfono -->
    <rect x="60" y="60" width="280" height="520" rx="16" fill="none" stroke="#B4B2A9" stroke-width="2"/>
    
    <!-- Barra de estado del teléfono -->
    <rect x="60" y="60" width="280" height="26" fill="white" rx="16 16 0 0" stroke="#B4B2A9" stroke-width="1"/>
    <text x="200" y="78" text-anchor="middle" style="font-size:11px">9:41</text>
    
    <!-- Contenido de la app -->
    <rect x="60" y="86" width="280" height="494" fill="white"/>
    
    <!-- NavBar inferior (igual a siempre) -->
    <rect x="60" y="530" width="280" height="50" fill="#F1EFE8"/>
    <text x="100" y="565" text-anchor="middle" style="font-size:12px;fill:#888780">Ofertas</text>
    <text x="200" y="565" text-anchor="middle" style="font-size:12px;font-weight:500;fill:#185FA5">✓ Inicio</text>
    <text x="300" y="565" text-anchor="middle" style="font-size:12px;fill:#888780">Configuración</text>
    
    <!-- AVISO PROMINENTE: La Nelly cobradora -->
    <g>
      <rect x="75" y="100" width="250" height="120" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
      <text x="200" y="125" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#791F1F">⚠ Tu cuota venció</text>
      <text x="200" y="145" text-anchor="middle" style="font-size:12px;fill:#791F1F">Tu abono de AppPromos</text>
      <text x="200" y="162" text-anchor="middle" style="font-size:12px;fill:#791F1F">venció el 27 de mayo.</text>
    </g>
    
    <!-- Detalles de deuda -->
    <rect x="75" y="230" width="250" height="80" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
    <text x="90" y="250" style="font-size:12px;font-weight:500;fill:#2C2C2A">Plan: Salvador</text>
    <text x="90" y="270" style="font-size:12px;fill:#2C2C2A">Monto: $25.000</text>
    <text x="90" y="290" style="font-size:12px;fill:#2C2C2A">Días vencido: 7</text>
    
    <!-- Botón de acción: Pagar ahora -->
    <rect x="75" y="320" width="250" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="200" y="350" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#0C447C">Pagar mi abono</text>
    
    <!-- Información secundaria -->
    <text x="90" y="380" style="font-size:11px;fill:#888780">Mientras no regularices,</text>
    <text x="90" y="395" style="font-size:11px;fill:#888780">no puedes crear ofertas.</text>
    
    <!-- Función bloqueada visual -->
    <rect x="75" y="410" width="250" height="40" rx="6" fill="#F1EFE8" opacity="0.5" stroke="#B4B2A9" stroke-width="0.5"/>
    <text x="200" y="437" text-anchor="middle" style="font-size:12px;fill:#888780">+ Crear oferta (bloqueado)</text>
  </g>

  <!-- Flecha: qué pasa si hace clic en "Pagar mi abono" -->
  <line x1="360" y1="205" x2="420" y2="205" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Flujo después del clic -->
  <g>
    <text x="480" y="90" style="font-size:14px;font-weight:500;fill:#2C2C2A">Tras clic en botón:</text>
    
    <!-- Paso 1: Abre link MP -->
    <g>
      <rect x="400" y="110" width="240" height="70" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
      <text x="520" y="138" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#27500A">1. Abre link MP</text>
      <text x="520" y="155" text-anchor="middle" style="font-size:12px;fill:#27500A">Carnicero paga desde</text>
      <text x="520" y="172" text-anchor="middle" style="font-size:12px;fill:#27500A">su celular</text>
    </g>

    <!-- Flecha -->
    <line x1="520" y1="180" x2="520" y2="210" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Paso 2: Pago confirmado -->
    <g>
      <rect x="400" y="210" width="240" height="70" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
      <text x="520" y="238" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#085041">2. Pago confirmado</text>
      <text x="520" y="255" text-anchor="middle" style="font-size:12px;fill:#085041">MP envía recibo</text>
      <text x="520" y="272" text-anchor="middle" style="font-size:12px;fill:#085041">Admin ve en Panel</text>
    </g>

    <!-- Flecha -->
    <line x1="520" y1="280" x2="520" y2="310" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Paso 3: Admin marca en panel -->
    <g>
      <rect x="400" y="310" width="240" height="70" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
      <text x="520" y="338" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#0C447C">3. Admin confirma</text>
      <text x="520" y="355" text-anchor="middle" style="font-size:12px;fill:#0C447C">Clic: "Marcar pago"</text>
      <text x="520" y="372" text-anchor="middle" style="font-size:12px;fill:#0C447C">en el Panel</text>
    </g>

    <!-- Flecha -->
    <line x1="520" y1="380" x2="520" y2="410" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Paso 4: La Nelly desaparece -->
    <g>
      <rect x="400" y="410" width="240" height="70" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
      <text x="520" y="438" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#27500A">4. Aviso desaparece</text>
      <text x="520" y="455" text-anchor="middle" style="font-size:12px;fill:#27500A">Carnicero recupera</text>
      <text x="520" y="472" text-anchor="middle" style="font-size:12px;fill:#27500A">acceso a todas funciones</text>
    </g>
  </g>

  <!-- Nota de estado -->
  <text x="340" y="560" text-anchor="middle" style="font-size:12px;fill:#888780">El aviso persiste hasta que el admin confirme el pago (aún en desarrollo automático en V13.0)</text>
</svg>
